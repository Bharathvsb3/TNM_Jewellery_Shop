<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Registration - Jewellery Shop</title>
    <link rel="stylesheet" href="css/responsive-fix.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F4E5C2;
            --gold-dark: #B8941F;
            --blue-primary: #1A4D7B;
            --blue-light: #4A7BA7;
            --blue-dark: #0F3556;
            --emerald: #50C878;
            --white: #FFFFFF;
            --light-bg: #F8F9FA;
            --text-dark: #2C3E50;
            --text-light: #6C757D;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-primary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-header {
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 100%);
            padding: 40px 30px;
            text-align: center;
            color: var(--white);
        }

        .register-header h1 {
            font-family: 'Noto Serif', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .register-header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .register-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .material-symbols-outlined {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 45px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Manrope', sans-serif;
            transition: all 0.3s ease;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
            padding-top: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--emerald) 0%, #3DA864 100%);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(80, 200, 120, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(80, 200, 120, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #E0E0E0;
        }

        .divider span {
            position: relative;
            background: var(--white);
            padding: 0 15px;
            color: var(--text-light);
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: var(--blue-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: var(--gold-primary);
        }

        .error-message, .success-message {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            background: #FEE;
            color: #C33;
            border-left: 4px solid #C33;
        }

        .success-message {
            background: #EFE;
            color: #3A3;
            border-left: 4px solid #3A3;
        }

        .error-message.show, .success-message.show {
            display: block;
        }

        .optional-label {
            color: var(--text-light);
            font-weight: 400;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .register-container {
                max-width: 100%;
            }

            .register-header {
                padding: 30px 20px;
            }

            .register-header h1 {
                font-size: 24px;
            }

            .register-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>💎 Join Us</h1>
            <p>Create your customer account to start ordering</p>
        </div>

        <div class="register-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">person</span>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="Enter your full name" 
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">phone</span>
                        <input 
                            type="tel" 
                            id="mobile" 
                            name="mobile" 
                            placeholder="Enter your mobile number" 
                            required
                            pattern="[0-9]{10}"
                            maxlength="10">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">
                        Address 
                        <span class="optional-label">(Optional)</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">home</span>
                        <textarea 
                            id="address" 
                            name="address" 
                            placeholder="Enter your address"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">lock</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Create a password" 
                            required
                            minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">lock</span>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm your password" 
                            required
                            minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn-register">Create Account</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="login-link">
                <p>Already have an account? <a href="customer-index.html">Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate name
            if (!name || name.length < 2) {
                showError('Please enter a valid name');
                return;
            }

            // Validate mobile
            if (mobile.length !== 10 || !/^[0-9]{10}$/.test(mobile)) {
                showError('Please enter a valid 10-digit mobile number');
                return;
            }

            // Validate password
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        mobile: mobile,
                        address: address || null,
                        password: password,
                        role: 'CUSTOMER',
                        autoApprove: CONFIG.AUTO_APPROVE_CUSTOMER  // Use config flag
                    })
                });

                if (response.ok) {
                    const data = await response.json();

                    // Show message based on account status
                    if (data.accountStatus === 'Approved') {
                        showSuccess('✅ Registration successful! Redirecting to login...');
                        setTimeout(() => {
                            window.location.href = 'customer-index.html';
                        }, 2000);
                    } else {
                        showSuccess('✅ Account created successfully!\\n\\n⏳ Please wait for admin approval before you can login.');
                        setTimeout(() => {
                            window.location.href = 'customer-index.html';
                        }, 4000);
                    }
                } else {
                    const error = await response.json();
                    showError(error.message || 'Registration failed. Mobile number may already exist.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError('Unable to connect to server. Please try again.');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            successDiv.classList.remove('show');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.remove('show');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }

        // Check if already logged in
        if (localStorage.getItem('customerToken')) {
            window.location.href = 'customer.html';
        }
    </script>
</body>
</html>
