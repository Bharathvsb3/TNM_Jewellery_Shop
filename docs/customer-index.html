<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Jewellery Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F4E5C2;
            --gold-dark: #B8941F;
            --blue-primary: #1A4D7B;
            --blue-light: #4A7BA7;
            --blue-dark: #0F3556;
            --emerald: #50C878;
            --white: #FFFFFF;
            --light-bg: #F8F9FA;
            --text-dark: #2C3E50;
            --text-light: #6C757D;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-primary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 100%);
            padding: 40px 30px;
            text-align: center;
            color: var(--white);
        }

        .login-header h1 {
            font-family: 'Noto Serif', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .material-symbols-outlined {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 14px 45px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Manrope', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 100%);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #E0E0E0;
        }

        .divider span {
            position: relative;
            background: var(--white);
            padding: 0 15px;
            color: var(--text-light);
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: var(--blue-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: var(--gold-primary);
        }

        .error-message {
            background: #FEE;
            color: #C33;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #C33;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .login-container {
                max-width: 100%;
                min-height: 100vh;
                border-radius: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                box-shadow: none;
            }

            .login-header {
                padding: max(40px, env(safe-area-inset-top)) 20px 30px;
                background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 100%);
            }

            .login-header h1 {
                font-size: 26px;
            }

            .login-body {
                padding: 30px 20px;
                flex: 1;
                background: var(--white);
            }
            
            input {
                font-size: 16px; /* Prevents iOS zoom */
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>✨ Customer Portal</h1>
            <p>Welcome back! Login to view your orders</p>
        </div>

        <div class="login-body">
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">phone</span>
                        <input 
                            type="tel" 
                            id="mobile" 
                            name="mobile" 
                            placeholder="Enter your mobile number" 
                            required
                            pattern="[0-9]{10}"
                            maxlength="10">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">lock</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required>
                    </div>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="register-link">
                <p>Don't have an account? <a href="customer-register.html">Register Now</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const mobile = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value;

            // Validate mobile
            if (mobile.length !== 10 || !/^[0-9]{10}$/.test(mobile)) {
                showError('Please enter a valid 10-digit mobile number');
                return;
            }

            if (!password) {
                showError('Please enter your password');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        emailOrMobile: mobile,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();

                    // Check if user is a customer
                    if (data.role !== 'CUSTOMER') {
                        showError('Access denied. This portal is for customers only.');
                        return;
                    }

                    // Check account status
                    if (data.accountStatus && data.accountStatus !== 'Approved') {
                        if (data.accountStatus === 'Pending') {
                            showError('⏳ Your account is under admin approval.\\n\\nPlease wait for approval before you can login.');
                        } else if (data.accountStatus === 'Rejected') {
                            showError('❌ Your account has been rejected by admin.\\n\\nPlease contact support for more information.');
                        }
                        return;
                    }

                    // Store auth data
                    localStorage.setItem('customerToken', data.token);
                    localStorage.setItem('customerId', data.id);
                    localStorage.setItem('customerName', data.name);
                    localStorage.setItem('customerMobile', data.mobile);
                    localStorage.setItem('customerRole', data.role);
                    localStorage.setItem('customerAccountStatus', data.accountStatus);

                    // Register device for chat notifications
                    try {
                        const fcmToken = localStorage.getItem('fcmToken') || '';
                        if (fcmToken) {
                            await fetch(`${API_BASE_URL}/Chat/registerDevice`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    userId: mobile,
                                    fcmToken: fcmToken,
                                    deviceType: 'WEB'
                                })
                            });
                        }
                    } catch (err) {
                        console.log('Device registration skipped:', err);
                    }

                    // Redirect to customer dashboard
                    window.location.href = 'customer.html';
                } else {
                    const error = await response.json();
                    // Check if it's likely an approval issue
                    if (error.message && error.message.includes('credentials')) {
                        // Could be invalid credentials OR pending approval
                        showError('❌ Invalid mobile number or password.\\n\\n⚠️ If you recently registered with auto-approval OFF, please wait for admin approval.');
                    } else {
                        showError(error.message || 'Invalid mobile number or password');
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Unable to connect to server. Please try again.');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Check if already logged in
        if (localStorage.getItem('customerToken')) {
            window.location.href = 'customer.html';
        }
    </script>
</body>
</html>
