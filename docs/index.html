<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: 700px;
            max-width: 95%;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d5d8dc;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #4a7cff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 10px 12px;
            background: #f1f5f9;
            border-radius: 7px;
            font-weight: 600;
        }

        .response-title {
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #d5d8dc;
            border-radius: 7px;
            font-family: Consolas, monospace;
            font-size: 13px;
            background: #111827;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Mobile License API Tester</h2>

    <div class="field">
        <label>API URL</label>
        <input
            type="text"
            id="url"
            value="https://licensingapi.silvercreek.com/api/Licensing/MobileLicenseActivation">
    </div>

    <div class="field">
        <label>Client Code</label>
        <input type="text" id="clientCode" value="STR">
    </div>

    <div class="field">
        <label>Application Code</label>
        <input type="text" id="applicationCode" value="WMS">
    </div>

    <div class="field">
        <label>Device ID</label>
        <input type="text" id="deviceId" placeholder="Enter Device ID">
    </div>

    <div class="field">
        <label>Device Name</label>
        <input type="text" id="deviceName" placeholder="Enter Device Name">
    </div>

    <div class="field">
        <label>Device Type</label>
        <input type="text" id="deviceType" value="Android">
    </div>

    <button id="runBtn" onclick="callApi()">
        Run API
    </button>

    <div class="status" id="status">
        Status: Not executed
    </div>

    <div class="response-title">
        API Response
    </div>

    <textarea id="response" readonly></textarea>

</div>

<script>
async function callApi() {

    const button = document.getElementById("runBtn");
    const status = document.getElementById("status");
    const responseBox = document.getElementById("response");

    const url = document.getElementById("url").value.trim();

    const requestData = {
        ClientCode: document.getElementById("clientCode").value.trim(),
        ApplicationCode: document.getElementById("applicationCode").value.trim(),
        DeviceId: document.getElementById("deviceId").value.trim(),
        DeviceName: document.getElementById("deviceName").value.trim(),
        DeviceType: document.getElementById("deviceType").value.trim()
    };

    button.disabled = true;
    button.innerText = "Calling API...";
    status.innerText = "Status: Calling...";
    responseBox.value = "";

    try {

        const response = await fetch(url, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(requestData)
        });

        const text = await response.text();

        status.innerText =
            `Status: ${response.status} ${response.statusText}`;

        try {
            const json = JSON.parse(text);

            responseBox.value =
                JSON.stringify(json, null, 4);

        } catch {
            responseBox.value = text;
        }

    } catch (error) {

        status.innerText = "Status: Request Failed";

        responseBox.value =
            error.message;
    }

    button.disabled = false;
    button.innerText = "Run API";
}
</script>

</body>
</html>
