<style>
/* ===== PREMIUM ENQUIRIES PAGE - NOIR & GOLD ===== */
.enq-wrap {
    max-width: 1200px; margin: 0 auto;
    animation: pageIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes pageIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

/* Page Header */
.page-hero {
    background: linear-gradient(135deg, #1a0a00, #3a1f00 60%, #5a3000);
    border-radius: 20px; padding: 40px 40px 36px;
    margin-bottom: 36px; position: relative; overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.15);
}
.page-hero::after {
    content: '◆'; position: absolute; right: 32px; top: 50%;
    transform: translateY(-50%) rotate(15deg); font-size: 100px;
    color: rgba(212,175,55,0.08); pointer-events: none;
}
.page-hero-eyebrow {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(212,175,55,0.7); font-weight: 600; margin-bottom: 8px;
}
.page-hero-title {
    font-family: 'Noto Serif', serif; font-size: clamp(24px,4vw,38px);
    color: #fff; font-weight: 700; margin-bottom: 8px;
}
.page-hero-sub { color: rgba(255,255,255,0.65); font-size: 14px; }

/* Grid */
.enquiries-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}

/* Cards */
.enq-card {
    background: #fff; border-radius: 18px;
    border: 1px solid rgba(212,175,55,0.12);
    overflow: hidden; transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    animation: cardReveal 0.5s ease backwards;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
@keyframes cardReveal { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
.enq-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(212,175,55,0.18); border-color: rgba(212,175,55,0.35); }

.enq-card-accent {
    height: 4px;
    background: linear-gradient(90deg, #D4AF37, #FFD700, #B8941F);
}
.enq-card-accent.status-new      { background: linear-gradient(90deg, #3B82F6, #60A5FA); }
.enq-card-accent.status-followup { background: linear-gradient(90deg, #F59E0B, #FCD34D); }
.enq-card-accent.status-converted{ background: linear-gradient(90deg, #10B981, #34D399); }
.enq-card-accent.status-closed   { background: linear-gradient(90deg, #9CA3AF, #D1D5DB); }

.enq-card-body { padding: 24px; }

.enq-card-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 16px; gap: 12px;
}
.enq-card-subject {
    font-family: 'Noto Serif', serif;
    font-size: 17px; font-weight: 700; color: var(--text-dark);
    line-height: 1.3; flex: 1;
}
.enq-badge {
    padding: 4px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    white-space: nowrap; flex-shrink: 0;
}
.enq-badge.status-new      { background: #DBEAFE; color: #1D4ED8; }
.enq-badge.status-followup { background: #FEF3C7; color: #B45309; }
.enq-badge.status-converted{ background: #D1FAE5; color: #065F46; }
.enq-badge.status-closed   { background: #F3F4F6; color: #4B5563; }

.enq-date { font-size: 12px; color: var(--text-light); margin-bottom: 16px; display: flex; align-items: center; gap: 4px; }
.enq-date .material-symbols-outlined { font-size: 14px; }

.enq-details { display: flex; flex-direction: column; gap: 10px; }
.enq-detail-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--light-bg);
    border-radius: 10px; font-size: 13px;
}
.enq-detail-row .material-symbols-outlined { font-size: 18px; color: var(--gold-primary); flex-shrink: 0; }
.enq-detail-label { color: var(--text-light); min-width: 80px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.enq-detail-value { color: var(--text-dark); font-weight: 600; }

.enq-desc {
    margin-top: 14px; padding: 12px 16px;
    background: linear-gradient(135deg, rgba(212,175,55,0.05), rgba(212,175,55,0.02));
    border-left: 3px solid rgba(212,175,55,0.4);
    border-radius: 0 10px 10px 0; font-size: 13px;
    color: var(--text-dark); line-height: 1.6; font-style: italic;
}

/* Empty / Loading state */
.enq-empty-state {
    grid-column: 1 / -1; text-align: center; padding: 80px 20px;
}
.enq-empty-state .empty-icon {
    width: 100px; height: 100px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.05));
    border: 2px solid rgba(212,175,55,0.2);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
}
.enq-empty-state .material-symbols-outlined { font-size: 48px; color: var(--gold-primary); opacity: 0.6; }
.enq-empty-state h3 { font-family: 'Noto Serif', serif; font-size: 22px; color: var(--text-dark); margin-bottom: 8px; }
.enq-empty-state p { color: var(--text-light); font-size: 14px; }

/* Responsive */
@media (max-width: 768px) {
    .page-hero { padding: 24px 20px; margin-bottom: 20px; }
    .page-hero::after { display: none; }
    .page-hero-title { font-size: 22px; }
    .page-hero-sub { font-size: 12px; }
    .enquiries-grid { grid-template-columns: 1fr; gap: 12px; }
    .enq-card-body { padding: 16px; }
}
@media (max-width: 480px) {
    .enq-card-header { flex-direction: column; gap: 8px; }
}
</style>

<div class="enq-wrap">
    <div class="page-hero">
        <div class="page-hero-eyebrow">My Account</div>
        <h1 class="page-hero-title">My Enquiries</h1>
        <p class="page-hero-sub">Track your jewellery consultations and their current progress</p>
    </div>

    <div class="enquiries-grid" id="enquiries-list">
        <div class="enq-empty-state">
            <div class="empty-icon">
                <span class="material-symbols-outlined">sync</span>
            </div>
            <h3>Loading Enquiries...</h3>
            <p>Fetching your consultation history</p>
        </div>
    </div>
</div>

<script>
async function loadCustomerEnquiries() {
    try {
        const user  = getCurrentUser();
        const token = getAuthToken();
        if (!user || !token) { showEnqEmpty('Authentication required. Please log in again.'); return; }

        const allEnquiries = await apiRequest(`${API_BASE_URL}/Enquiries`);
        const mine = (allEnquiries || []).filter(e => e.customerMobile === user.mobile);
        renderEnquiries(mine);
    } catch(err) {
        console.error('Enquiries error:', err);
        showEnqEmpty('Unable to load enquiries. Please try again later.');
    }
}

function showEnqEmpty(msg) {
    document.getElementById('enquiries-list').innerHTML = `
        <div class="enq-empty-state">
            <div class="empty-icon"><span class="material-symbols-outlined">info</span></div>
            <h3>No Enquiries Found</h3>
            <p>${msg}</p>
        </div>`;
}

function renderEnquiries(enquiries) {
    const container = document.getElementById('enquiries-list');
    if (!enquiries || enquiries.length === 0) {
        container.innerHTML = `
            <div class="enq-empty-state">
                <div class="empty-icon"><span class="material-symbols-outlined">contact_support</span></div>
                <h3>No Enquiries Yet</h3>
                <p>Your jewellery consultations will appear here once submitted.</p>
            </div>`;
        return;
    }

    enquiries.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    const statusMap = {
        'New': 'new', 'Follow-Up': 'followup', 'FollowUp': 'followup',
        'Converted': 'converted', 'Closed': 'closed'
    };

    container.innerHTML = enquiries.map((e, i) => {
        const statusClass = statusMap[e.status] || 'new';
        const date = e.createdAt ? new Date(e.createdAt).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' }) : '—';
        return `
        <div class="enq-card" style="animation-delay:${i*0.06}s">
            <div class="enq-card-accent status-${statusClass}"></div>
            <div class="enq-card-body">
                <div class="enq-card-header">
                    <div class="enq-card-subject">${e.subject || 'Jewellery Enquiry'}</div>
                    <div class="enq-badge status-${statusClass}">${e.status || 'New'}</div>
                </div>
                <div class="enq-date">
                    <span class="material-symbols-outlined">calendar_today</span>
                    ${date}
                </div>
                <div class="enq-details">
                    ${e.metalType ? `<div class="enq-detail-row">
                        <span class="material-symbols-outlined">category</span>
                        <span class="enq-detail-label">Metal</span>
                        <span class="enq-detail-value">${e.metalType}</span>
                    </div>` : ''}
                    ${e.jewelryType ? `<div class="enq-detail-row">
                        <span class="material-symbols-outlined">diamond</span>
                        <span class="enq-detail-label">Jewellery</span>
                        <span class="enq-detail-value">${e.jewelryType}</span>
                    </div>` : ''}
                    ${e.purity ? `<div class="enq-detail-row">
                        <span class="material-symbols-outlined">verified</span>
                        <span class="enq-detail-label">Purity</span>
                        <span class="enq-detail-value">${e.purity}</span>
                    </div>` : ''}
                    ${e.estimatedWeight ? `<div class="enq-detail-row">
                        <span class="material-symbols-outlined">scale</span>
                        <span class="enq-detail-label">Weight</span>
                        <span class="enq-detail-value">${e.estimatedWeight}g (est.)</span>
                    </div>` : ''}
                </div>
                ${e.description ? `<div class="enq-desc">"${e.description}"</div>` : ''}
            </div>
        </div>`;
    }).join('');
}

window.addEventListener('pageLoaded', ev => { if (ev.detail?.route === 'enquiries') loadCustomerEnquiries(); });
if (window.location.hash.includes('enquiries')) loadCustomerEnquiries();
</script>
