<script>
// Customer Chat WebSocket Integration
let customerChatManager = null;
let initRetryCount = 0;
const MAX_INIT_RETRIES = 3;

function initializeCustomerChat() {
    console.log('🚀 Initializing customer WebSocket chat...');
    
    const userStr = localStorage.getItem('user');
    if (!userStr) {
        console.error('❌ No user logged in');
        return;
    }
    
    // Check if ChatManager is loaded
    if (typeof ChatManager === 'undefined') {
        console.error('❌ ChatManager not loaded. Make sure chat-manager-websocket.js is included.');
        
        // Retry initialization
        if (initRetryCount < MAX_INIT_RETRIES) {
            initRetryCount++;
            console.log(`🔄 Retrying initialization (${initRetryCount}/${MAX_INIT_RETRIES}) in 1 second...`);
            setTimeout(initializeCustomerChat, 1000);
        } else {
            console.error('❌ Failed to initialize chat after multiple retries');
        }
        return;
    }
    
    if (!customerChatManager) {
        try {
            customerChatManager = new ChatManager(false);
            customerChatManager.initialize();
            console.log('✅ Customer WebSocket connected');
            initRetryCount = 0; // Reset counter on success
        } catch (error) {
            console.error('❌ Error initializing ChatManager:', error);
            customerChatManager = null;
            
            // Retry on error
            if (initRetryCount < MAX_INIT_RETRIES) {
                initRetryCount++;
                console.log(`🔄 Retrying after error (${initRetryCount}/${MAX_INIT_RETRIES})...`);
                setTimeout(initializeCustomerChat, 2000);
            }
        }
    }
}

async function sendCustomerMessage(event) {
    if (event) event.preventDefault();
    
    const input = document.getElementById('customer-message-input');
    if (!input) return;
    
    if (!customerChatManager) {
        console.error('❌ Chat not initialized. Attempting to reconnect...');
        initializeCustomerChat();
        return;
    }
    
    const text = input.value.trim();
    if (!text) return;
    
    try {
        const success = await customerChatManager.sendMessage(text);
        if (success) {
            input.value = '';
            input.focus();
        } else {
            console.error('❌ Failed to send message');
        }
    } catch (error) {
        console.error('❌ Error sending message:', error);
    }
}

async function sendQuickMessage(message) {
    if (!customerChatManager) {
        console.error('❌ Chat not initialized');
        initializeCustomerChat();
        return;
    }
    
    try {
        const success = await customerChatManager.sendMessage(message);
        if (success) {
            const quickActions = document.getElementById('quick-actions');
            if (quickActions) quickActions.style.display = 'none';
        }
    } catch (error) {
        console.error('❌ Error sending quick message:', error);
    }
}

function refreshCustomerChat() {
    console.log('🔄 Refreshing chat connection...');
    if (customerChatManager) {
        customerChatManager.destroy();
        customerChatManager = null;
    }
    initRetryCount = 0;
    initializeCustomerChat();
}

// Auto-initialize
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(initializeCustomerChat, 500));
} else {
    setTimeout(initializeCustomerChat, 500);
}

// Reconnect on window focus (handles laptop wake, tab activation)
window.addEventListener('focus', () => {
    if (customerChatManager && customerChatManager.connectionState === 'disconnected') {
        console.log('🔄 Window focused - reconnecting chat...');
        refreshCustomerChat();
    }
});

// Cleanup
window.addEventListener('beforeunload', () => {
    if (customerChatManager) {
        customerChatManager.destroy();
        customerChatManager = null;
    }
});
</script>
