<!-- Customer Floating Chat Widget -->
<div id="customer-chat-widget" class="chat-widget-container" style="display:none;">
    <!-- Chat Button -->
    <button class="chat-fab-button" id="chat-fab-btn" onclick="toggleCustomerChat()">
        <span class="material-symbols-outlined">chat</span>
        <span class="chat-unread-badge" id="chat-unread-badge" style="display:none;">0</span>
    </button>

    <!-- Chat Popup -->
    <div class="chat-popup" id="chat-popup" style="display:none;">
        <!-- Header -->
        <div class="chat-popup-header">
            <div class="chat-header-info">
                <div class="chat-logo-avatar">
                    <span class="material-symbols-outlined">storefront</span>
                </div>
                <div>
                    <h4 id="chat-shop-name">Shop Support</h4>
                    <p class="chat-status"><span class="status-dot"></span> Online</p>
                </div>
            </div>
            <button class="btn-close-chat" onclick="toggleCustomerChat()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Messages Area -->
        <div class="chat-popup-messages" id="chat-popup-messages">
            <div class="chat-welcome" id="chat-welcome">
                <div class="welcome-icon">
                    <span class="material-symbols-outlined">forum</span>
                </div>
                <h3>Welcome!</h3>
                <p>How can we help you today?</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-popup-input">
            <textarea 
                id="customer-message-input" 
                placeholder="Type your message..."
                rows="1"
                maxlength="5000"></textarea>
            <button class="btn-send-message" onclick="sendCustomerMessage()">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </div>
</div>

<style>

    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 10000;
}

    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #775a19 0%, #c5a059 100%);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(119, 90, 25, 0.4);
    transition: all 0.3s ease;
    position: relative;
}

.chat-fab-button:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(119, 90, 25, 0.5);
}

.chat-fab-button .material-symbols-outlined {
    font-size: 28px;
}

.chat-unread-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
}

.chat-popup {
    position: absolute;
    bottom: 72px;
    right: 0;
    width: 380px;
    height: 500px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-popup-header {
    background: linear-gradient(135deg, #775a19 0%, #c5a059 100%);
    color: white;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chat-header-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-logo-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    color: #775a19;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-popup-header h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
}

    margin: 4px 0 0 0;

    animation: pulse 2s infinite;

    0%, 100% { opacity: 1; }

.btn-close-chat {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;

.chat-popup-messages {
    flex: 1;
    overflow-y: auto;

        height: 100%;
        border-radius: 0;
    }

</style>

<script>
// Customer Chat Widget Logic
let customerChatOpen = false;
let customerChatManager = null;

function initCustomerChatWidget() {
    const widget = document.getElementById('customer-chat-widget');
    if (widget) {
        widget.style.display = 'block';
        
        // Initialize customer chat manager
        if (!customerChatManager) {
            customerChatManager = new ChatManager(false);
            customerChatManager.initialize();
        }
        
        // Poll for unread count
        setInterval(updateUnreadCount, 10000);
        updateUnreadCount();
    }
}

function toggleCustomerChat() {
    customerChatOpen = !customerChatOpen;
    const popup = document.getElementById('chat-popup');
    
    if (popup) {
        popup.style.display = customerChatOpen ? 'flex' : 'none';
        
        if (customerChatOpen && customerChatManager) {
            customerChatManager.loadMessages();
            setTimeout(() => {
                const input = document.getElementById('customer-message-input');
                if (input) input.focus();
            }, 300);
        }
    }
}

async function sendCustomerMessage() {
    const input = document.getElementById('customer-message-input');
    if (!input || !customerChatManager) return;

    const text = input.value.trim();
    if (!text) return;

    const success = await customerChatManager.sendMessage(text);
    
    if (success) {
        input.value = '';
        input.style.height = 'auto';
    }
}

async function updateUnreadCount() {
    if (!customerChatManager) return;
    
    try {
        const response = await fetch(
            `${API_BASE_URL}/Chat/unread?custno=${customerChatManager.currentUser.phone}`,
            { headers: customerChatManager.getHeaders() }
        );
        
        const data = await response.json();
        
        if (data.success && data.count > 0) {
            const badge = document.getElementById('chat-unread-badge');
            if (badge) {
                badge.textContent = data.count;
                badge.style.display = 'block';
            }
        } else {
            const badge = document.getElementById('chat-unread-badge');
            if (badge) badge.style.display = 'none';
        }
    } catch (error) {
        console.error('Error getting unread count:', error);
    }
}

// Auto-init on page load
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCustomerChatWidget);
} else {
    initCustomerChatWidget();
}

// Enter key to send
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && customerChatOpen) {
        const input = document.getElementById('customer-message-input');
        if (input === document.activeElement) {
            e.preventDefault();
            sendCustomerMessage();
        }
    }
});
</script>
