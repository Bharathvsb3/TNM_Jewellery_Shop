<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#002a1d",
                    "secondary": "#775a19",
                    "surface": "#fbf9f5",
                    "on-surface": "#1b1c1a",
                    "on-surface-variant": "#404944",
                    "surface-container-low": "#f5f3ef",
                    "surface-container-lowest": "#ffffff"
                },
                fontFamily: {
                    "headline": ["Noto Serif", "serif"],
                    "body": ["Manrope", "sans-serif"],
                    "label": ["Manrope", "sans-serif"]
                }
            }
        }
    }
</script>
<style>
    .ghost-border {
        border-bottom-width: 1px;
        border-bottom-color: rgba(229, 231, 235, 0.5);
    }

    /* Modal fixed styles */
    .product-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 5000;
        padding: 20px;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
    }
    .product-modal.show {
        display: flex;
    }
    
    .loading-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
</style>

<div class="px-2 md:px-8 py-4 md:py-8 max-w-[90rem] mx-auto w-full font-body text-on-surface">

    <!-- Page Header -->
    <header class="mb-6 md:mb-10 max-w-2xl">
        <p class="font-label text-[0.65rem] text-secondary uppercase tracking-[0.2em] mb-2" id="productsEyebrow">The Collection</p>
        <h1 class="font-headline text-2xl md:text-4xl text-primary leading-tight mb-3" id="productsTitle">Fine Jewellery</h1>
        <p class="font-body text-sm text-on-surface-variant max-w-lg leading-relaxed" id="productsDesc">Discover our curated archive of exceptional craftsmanship, meticulously selected for enduring elegance.</p>
    </header>

    <div class="flex flex-col md:flex-row gap-12 lg:gap-24 relative">
        
        <!-- Filter Sidebar -->
        <aside class="w-full md:w-64 flex-shrink-0 relative md:sticky md:top-32 h-max z-10 bg-surface rounded-lg">
            <div class="space-y-8">
                <!-- Category Filter -->
                <div class="bg-surface-container-low p-6 md:p-8 rounded-lg shadow-sm border border-gray-100">
                    <h3 class="font-headline text-lg text-primary mb-6 uppercase tracking-widest border-b border-gray-200 pb-2">Category</h3>
                    <ul class="space-y-4 font-body text-sm text-on-surface" id="filterList">
                        <li>
                            <label class="flex items-center space-x-3 cursor-pointer group" onclick="filterProducts('All')">
                                <div id="radio-All" class="w-4 h-4 flex items-center justify-center bg-transparent border border-gray-300 rounded-full group-hover:border-secondary transition-colors">
                                    <div class="w-2 h-2 bg-secondary rounded-full"></div>
                                </div>
                                <span class="group-hover:text-secondary transition-colors font-semibold">All Pieces</span>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center space-x-3 cursor-pointer group" onclick="filterProducts('Gold')">
                                <div id="radio-Gold" class="w-4 h-4 flex items-center justify-center bg-transparent border border-gray-300 rounded-full group-hover:border-secondary transition-colors">
                                    <div class="w-2 h-2 bg-secondary rounded-full hidden"></div>
                                </div>
                                <span class="text-on-surface-variant group-hover:text-primary transition-colors">Gold Collection</span>
                            </label>
                        </li>
                        <li>
                            <label class="flex items-center space-x-3 cursor-pointer group" onclick="filterProducts('Silver')">
                                <div id="radio-Silver" class="w-4 h-4 flex items-center justify-center bg-transparent border border-gray-300 rounded-full group-hover:border-secondary transition-colors">
                                    <div class="w-2 h-2 bg-secondary rounded-full hidden"></div>
                                </div>
                                <span class="text-on-surface-variant group-hover:text-primary transition-colors">Silver Collection</span>
                            </label>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <div class="flex-grow">
            <!-- Active Filters & Sorting Mobile -->
            <div class="flex justify-between items-center mb-8 pb-4 ghost-border">
                <span class="font-body text-xs md:text-sm text-on-surface-variant" id="productCount">Loading pieces...</span>
                <span class="material-symbols-outlined text-secondary">diamond</span>
            </div>
            
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
                <!-- Loader -->
                <div class="col-span-1 sm:col-span-2 lg:col-span-3 text-center py-20 text-gray-500 loading-pulse">
                    <span class="material-symbols-outlined text-4xl mb-4 text-secondary">sync</span>
                    <p class="tracking-widest uppercase text-xs">Curating Collection...</p>
                </div>
            </div>
            
        </div>
    </div>
</div>

<!-- Product Modal -->
<div id="productModal" class="product-modal">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden flex flex-col transform transition-all duration-300">
        <div class="relative">
            <img id="modalImg" src="" alt="Jewelry" class="w-full h-72 object-cover bg-gray-100">
            <button class="absolute top-4 right-4 bg-white/80 p-2 rounded-full text-gray-800 hover:bg-white" onclick="closeModal()">
                <span class="material-symbols-outlined text-xl block">close</span>
            </button>
            <div id="modalBadge" class="absolute bottom-4 left-4 bg-white/90 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-[#775a19] shadow-sm"></div>
        </div>
        <div class="p-8 flex flex-col items-center text-center">
            <p id="modalCategory" class="text-[0.65rem] uppercase tracking-[0.2em] text-gray-500 mb-2"></p>
            <h3 id="modalTitle" class="font-headline text-2xl text-[#002a1d] mb-4"></h3>
            
            <div class="w-full space-y-3 mb-8 border-t border-b border-gray-100 py-4 text-sm mt-2">
                <div class="flex justify-between">
                    <span class="text-gray-500">Material</span>
                    <span id="modalMetal" class="font-semibold text-gray-800"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">Approx Weight</span>
                    <span id="modalWeight" class="font-semibold text-gray-800"></span>
                </div>
            </div>

            <button onclick="createOrder(currentProductId)" class="w-full bg-[#002a1d] text-white py-4 font-label uppercase tracking-widest text-xs hover:bg-[#775a19] transition-colors rounded">
                Request Creation
            </button>
        </div>
    </div>
</div>

<!-- Custom Alert Modal -->
<div id="custom-alert-modal" class="fixed inset-0 bg-black/50 z-[110] hidden items-center justify-center p-4">
    <div class="bg-surface-container-lowest rounded-xl max-w-md w-full transform transition-all">
        <div class="p-6">
            <div class="flex items-start gap-4">
                <div id="alert-icon-container" class="flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-2xl" id="alert-icon">info</span>
                </div>
                <div class="flex-1">
                    <h3 id="alert-title" class="text-lg font-bold text-on-surface mb-2">Alert</h3>
                    <p id="alert-message" class="text-on-surface-variant text-sm whitespace-pre-line">Message</p>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" onclick="hideCustomAlert()" id="alert-ok-btn" class="px-6 py-2.5 rounded-lg font-bold transition-colors">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let allProducts = [];
    let currentFilter = 'All';
    let currentProductId = null;
    
    // Get auth token for API calls
    token = getAuthToken();
    user = getCurrentUser();

    async function loadProducts() {
        try {
            const response = await fetch(`${API_BASE_URL}/customer/products`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                allProducts = await response.json();
                displayProducts(allProducts);
            } else {
                showEmptyState();
            }
        } catch (error) {
            console.error('Error loading products:', error);
            showEmptyState();
        }
    }

    function displayProducts(products) {
        const grid = document.getElementById('productsGrid');
        
        if (!products || products.length === 0) {
            showEmptyState();
            return;
        }

        const activeProducts = products.filter(p => true); // In real app: p => p.isActive

        if (activeProducts.length === 0) {
            showEmptyState();
            return;
        }

        document.getElementById('productCount').textContent = `Showing ${activeProducts.length} pieces`;

        grid.innerHTML = activeProducts.map((product, idx) => `
            <article class="group cursor-pointer flex flex-col ${idx % 2 !== 0 ? 'sm:mt-12' : ''}" onclick="openProductModal(${product.id})">
                <div class="bg-surface-container-lowest aspect-[4/5] mb-6 overflow-hidden relative rounded-lg shadow-sm border border-gray-50">
                    <img alt="${product.name}" class="w-full h-full object-cover object-center transform group-hover:scale-105 transition-transform duration-700 ease-out" src="${product.image1 || 'https://via.placeholder.com/400x500/EAE8E4/775A19?text=Atelier'}"/>
                    <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <span class="material-symbols-outlined text-[#002a1d]">favorite</span>
                    </div>
                </div>
                <div class="flex flex-col flex-grow justify-between text-left">
                    <div>
                        <h3 class="font-headline text-lg text-primary mb-1">${product.name}</h3>
                        <p class="font-body text-[0.65rem] text-on-surface-variant uppercase tracking-widest mb-4">${product.metalType} · ${product.category}</p>
                    </div>
                    <p class="font-body text-sm font-semibold text-secondary">ID: #${product.id}</p>
                </div>
            </article>
        `).join('');
    }

    function openProductModal(productId) {
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;
        currentProductId = product.id;

        document.getElementById('modalImg').src = product.image1 || 'https://via.placeholder.com/400x500/EAE8E4/775A19?text=Atelier';
        document.getElementById('modalTitle').textContent = product.name;
        document.getElementById('modalCategory').textContent = product.category;
        document.getElementById('modalMetal').textContent = product.metalType;
        document.getElementById('modalBadge').textContent = product.metalType;
        document.getElementById('modalWeight').textContent = product.weight.toFixed(3) + 'g';

        document.getElementById('productModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('productModal').classList.remove('show');
        currentProductId = null;
    }

    function filterProducts(metalType) {
        currentFilter = metalType;

        // Reset all radio circles
        ['All', 'Gold', 'Silver'].forEach(type => {
            const radioNode = document.querySelector(`#radio-${type} > div`);
            if (radioNode) radioNode.classList.add('hidden');
        });

        // Activate the chosen radio
        const activeRadio = document.querySelector(`#radio-${metalType} > div`);
        if (activeRadio) activeRadio.classList.remove('hidden');

        // Filter contents
        if (metalType === 'All') {
            displayProducts(allProducts);
        } else {
            const filtered = allProducts.filter(p => p.metalType === metalType);
            displayProducts(filtered);
        }
    }

    function createOrder(productId) {
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;

        closeModal();

        const customWeight = prompt(`Request Creation: ${product.name}\n\nStandard weight: ${product.weight.toFixed(3)}g\n\nEnter desired custom weight (Optional):`);
        
        if (customWeight === null) {
            return;
        }

        const remarks = prompt('Any custom engraving or bespoke modifications? (Optional)');
        submitOrder(productId, customWeight, remarks);
    }

    async function submitOrder(productId, customWeight, remarks) {
        if (!token || !user) {
            showCustomAlert('Please securely authenticate to reserve pieces.', 'warning', '⚠️ Authentication Required');
            return;
        }
        
        const orderData = {
            productId: productId,
            customWeight: customWeight ? parseFloat(customWeight) : null,
            customerRemarks: remarks || null
        };

        try {
            const response = await fetch(`${API_BASE_URL}/customer/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(orderData)
            });

            if (response.ok) {
                showCustomAlert('Your creation request has been received by the Atelier!', 'success', '✅ Success');
                // Wait, trigger view orders or stay gracefully
                if(typeof window.navigate === 'function') {
                    window.navigate({preventDefault:()=>{}}, 'orders');
                } else {
                    window.location.hash = 'orders';
                }
            } else {
                showCustomAlert('Action declined by server.', 'error', '❌ Notice');
            }
        } catch (error) {
            showCustomAlert('Server communication interrupted. Please wait and try again.', 'error', '❌ Notice');
        }
    }

    function showEmptyState() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = `
            <div class="col-span-1 sm:col-span-2 lg:col-span-3 text-center py-20 text-gray-500">
                <span class="material-symbols-outlined text-4xl mb-4 opacity-50">auto_awesome</span>
                <h3 class="font-headline text-2xl text-primary mb-2">No Pieces Available</h3>
                <p class="font-body text-sm uppercase tracking-widest text-on-surface-variant">Check back later for our bespoke archive</p>
            </div>
        `;
        document.getElementById('productCount').textContent = 'Showing 0 pieces';
    }

    // Attach external clicks to close modal
    document.getElementById('productModal').addEventListener('click', (e) => {
        if (e.target.id === 'productModal') { closeModal(); }
    });

    // Pull branding from config
    if (typeof SHOP_CONFIG !== 'undefined') {
        const titleEl = document.getElementById('productsTitle');
        const descEl  = document.getElementById('productsDesc');
        if (titleEl) titleEl.textContent = `${SHOP_CONFIG.name} — Fine Jewellery`;
        if (descEl && SHOP_CONFIG.description) descEl.textContent = SHOP_CONFIG.description;
    }

    // Run sequence
    loadProducts();
    
    // Globally expose UI handlers so they map perfectly dynamically
    window.openProductModal = openProductModal;
    window.closeModal = closeModal;
    window.filterProducts = filterProducts;
    window.createOrder = createOrder;

    // Custom Alert Functions
    function showCustomAlert(message, type = 'info', title = null) {
        const modal = document.getElementById('custom-alert-modal');
        const iconContainer = document.getElementById('alert-icon-container');
        const icon = document.getElementById('alert-icon');
        const titleEl = document.getElementById('alert-title');
        const messageEl = document.getElementById('alert-message');
        const okBtn = document.getElementById('alert-ok-btn');
        
        // Set message
        messageEl.textContent = message;
        
        // Set type-specific styles
        if (type === 'success') {
            titleEl.textContent = title || 'Success';
            icon.textContent = 'check_circle';
            iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-green-100';
            icon.className = 'material-symbols-outlined text-2xl text-green-600';
            okBtn.className = 'px-6 py-2.5 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition-colors';
        } else if (type === 'error') {
            titleEl.textContent = title || 'Error';
            icon.textContent = 'error';
            iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-red-100';
            icon.className = 'material-symbols-outlined text-2xl text-red-600';
            okBtn.className = 'px-6 py-2.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition-colors';
        } else if (type === 'warning') {
            titleEl.textContent = title || 'Warning';
            icon.textContent = 'warning';
            iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-orange-100';
            icon.className = 'material-symbols-outlined text-2xl text-orange-600';
            okBtn.className = 'px-6 py-2.5 bg-orange-600 text-white rounded-lg font-bold hover:bg-orange-700 transition-colors';
        } else { // info
            titleEl.textContent = title || 'Information';
            icon.textContent = 'info';
            iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-blue-100';
            icon.className = 'material-symbols-outlined text-2xl text-blue-600';
            okBtn.className = 'px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors';
        }
        
        // Show modal
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        // Focus OK button
        setTimeout(() => okBtn.focus(), 100);
    }

    function hideCustomAlert() {
        const modal = document.getElementById('custom-alert-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

</script>
