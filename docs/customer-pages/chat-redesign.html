<script>
// Customer Chat State
let customerPhone = null;
let adminPhone = null; // This should be the shop's admin phone
let customerChatInterval = null;
let lastMessageId = 0;

// Initialize customer chat
window.addEventListener('pageLoaded', async (e) => {
    if (e.detail.route === 'customer-chat') {
        await initializeCustomerChat();
    }
});

// Cleanup on page unload
window.addEventListener('beforePageUnload', (e) => {
    if (e.detail.route === 'customer-chat') {
        if (customerChatInterval) {
            clearInterval(customerChatInterval);
            customerChatInterval = null;
        }
    }
});

async function initializeCustomerChat() {
    try {
        // Get current customer user
        const user = getCurrentUser();
        if (!user) {
            showCustomAlert('Please login to access chat', 'Error');
            window.location.hash = 'customer-login';
            return;
        }

        customerPhone = user.mobile;
        
        // For now, we'll use a default admin phone. 
        // In production, this should come from an API or config
        adminPhone = '9876543210'; // Replace with actual admin phone from settings

        // Load existing messages
        await loadCustomerMessages();

        // Show quick actions for first-time users
        const messagesWrapper = document.getElementById('customer-messages-wrapper');
        if (messagesWrapper.children.length === 1) { // Only welcome message
            document.getElementById('quick-actions').style.display = 'flex';
        }

        // Start auto-refresh
        startCustomerChatPolling();

    } catch (error) {
        console.error('Error initializing customer chat:', error);
        showCustomAlert('Error loading chat. Please refresh the page.', 'Error');
    }
}

async function loadCustomerMessages() {
    try {
        const response = await apiRequest(
            `${API_BASE_URL}/Chat/history?custno=${customerPhone}&toUser=${adminPhone}`
        );

        if (response.success) {
            const messages = response.data || [];
            renderCustomerMessages(messages);
            
            // Mark messages as read
            if (messages.length > 0) {
                await markCustomerMessagesAsRead();
            }
        }
    } catch (error) {
        console.error('Error loading messages:', error);
    }
}

function renderCustomerMessages(messages) {
    const wrapper = document.getElementById('customer-messages-wrapper');
    
    if (!messages || messages.length === 0) {
        // Keep welcome message
        return;
    }

    let lastDate = null;
    let html = '';

    messages.forEach(msg => {
        const msgDate = new Date(msg.addDate);
        const dateStr = msgDate.toLocaleDateString('en-IN');

        // Add date divider
        if (dateStr !== lastDate) {
            html += `
                <div class="customer-date-divider">
                    <span>${formatCustomerDateDivider(msgDate)}</span>
                </div>
            `;
            lastDate = dateStr;
        }

        const isSent = msg.fromUser === customerPhone;
        const time = msgDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

        html += `
            <div class="customer-message-bubble ${isSent ? 'sent' : 'received'}">
                <div class="customer-message-avatar">
                    <span class="material-symbols-outlined">${isSent ? 'person' : 'storefront'}</span>
                </div>
                <div class="customer-message-content">
                    <p class="customer-message-text">${escapeHtml(msg.messageText)}</p>
                    <span class="customer-message-time">${time}</span>
                </div>
            </div>
        `;

        lastMessageId = Math.max(lastMessageId, msg.id);
    });

    wrapper.innerHTML = html;

    // Scroll to bottom
    setTimeout(() => {
        const area = document.getElementById('customer-messages-area');
        area.scrollTop = area.scrollHeight;
    }, 100);

    // Hide quick actions if messages exist
    document.getElementById('quick-actions').style.display = 'none';
}

async function sendCustomerMessage(event) {
    event.preventDefault();

    const input = document.getElementById('customer-message-input');
    const message = input.value.trim();

    if (!message) return;

    const btn = document.getElementById('btn-send-customer');
    btn.disabled = true;

    try {
        const response = await apiRequest(`${API_BASE_URL}/Chat/sendMessage`, {
            method: 'POST',
            body: JSON.stringify({
                fromUser: customerPhone,
                toUser: adminPhone,
                message: message
            })
        });

        if (response.success) {
            input.value = '';
            
            // Add message optimistically to UI
            addMessageToUI(message, true);
            
            // Then refresh from server to ensure sync
            setTimeout(() => loadCustomerMessages(), 500);
        } else {
            throw new Error(response.message || 'Failed to send message');
        }
    } catch (error) {
        console.error('Error sending message:', error);
        showCustomAlert('Failed to send message. Please try again.', 'Error');
    } finally {
        btn.disabled = false;
        input.focus();
    }
}

function addMessageToUI(message, isSent) {
    const wrapper = document.getElementById('customer-messages-wrapper');
    
    // Remove welcome message if it exists
    const welcomeMsg = wrapper.querySelector('.welcome-message');
    if (welcomeMsg) {
        welcomeMsg.remove();
    }

    const now = new Date();
    const time = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

    const messageHtml = `
        <div class="customer-message-bubble ${isSent ? 'sent' : 'received'}">
            <div class="customer-message-avatar">
                <span class="material-symbols-outlined">${isSent ? 'person' : 'storefront'}</span>
            </div>
            <div class="customer-message-content">
                <p class="customer-message-text">${escapeHtml(message)}</p>
                <span class="customer-message-time">${time}</span>
            </div>
        </div>
    `;

    wrapper.insertAdjacentHTML('beforeend', messageHtml);

    // Scroll to bottom
    const area = document.getElementById('customer-messages-area');
    area.scrollTop = area.scrollHeight;
}

async function sendQuickMessage(message) {
    const input = document.getElementById('customer-message-input');
    input.value = message;
    input.focus();
}

async function markCustomerMessagesAsRead() {
    try {
        await apiRequest(
            `${API_BASE_URL}/Chat/markRead?custno=${customerPhone}&curuser=${adminPhone}`,
            { method: 'POST' }
        );
    } catch (error) {
        console.error('Error marking messages as read:', error);
    }
}

function startCustomerChatPolling() {
    // Poll for new messages every 5 seconds
    customerChatInterval = setInterval(() => {
        loadCustomerMessages();
    }, 5000);
}

function refreshCustomerChat() {
    loadCustomerMessages();
}

// Utility functions
function formatCustomerDateDivider(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) return 'Today';
    if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return date.toLocaleDateString('en-IN', { month: 'long', day: 'numeric', year: 'numeric' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Custom Alert Functions
function showCustomAlert(message, type = 'info', title = null) {
    const modal = document.getElementById('custom-alert-modal');
    const iconContainer = document.getElementById('alert-icon-container');
    const icon = document.getElementById('alert-icon');
    const titleEl = document.getElementById('alert-title');
    const messageEl = document.getElementById('alert-message');
    const okBtn = document.getElementById('alert-ok-btn');
    
    // Set message
    messageEl.textContent = message;
    
    // Set type-specific styles
    if (type === 'success') {
        titleEl.textContent = title || 'Success';
        icon.textContent = 'check_circle';
        iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-green-100';
        icon.className = 'material-symbols-outlined text-2xl text-green-600';
        okBtn.className = 'px-6 py-2.5 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 transition-colors';
    } else if (type === 'error') {
        titleEl.textContent = title || 'Error';
        icon.textContent = 'error';
        iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-red-100';
        icon.className = 'material-symbols-outlined text-2xl text-red-600';
        okBtn.className = 'px-6 py-2.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition-colors';
    } else if (type === 'warning') {
        titleEl.textContent = title || 'Warning';
        icon.textContent = 'warning';
        iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-orange-100';
        icon.className = 'material-symbols-outlined text-2xl text-orange-600';
        okBtn.className = 'px-6 py-2.5 bg-orange-600 text-white rounded-lg font-bold hover:bg-orange-700 transition-colors';
    } else { // info
        titleEl.textContent = title || 'Information';
        icon.textContent = 'info';
        iconContainer.className = 'flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center bg-blue-100';
        icon.className = 'material-symbols-outlined text-2xl text-blue-600';
        okBtn.className = 'px-6 py-2.5 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors';
    }
    
    // Show modal
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    
    // Focus OK button
    setTimeout(() => okBtn.focus(), 100);
}

function hideCustomAlert() {
    const modal = document.getElementById('custom-alert-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}
</script>
