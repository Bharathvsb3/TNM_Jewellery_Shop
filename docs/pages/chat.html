<script>
// Chat State
let currentAdminPhone = null;
let currentChatWithPhone = null;
let currentChatUserName = null;
let allConversations = [];
let adminChatManager = null;
let allMessages = []; // Store messages locally

// Initialize chat when page loads
window.addEventListener('pageLoaded', async (e) => {
    if (e.detail.route === 'chat') {
        await initializeAdminChat();
    }
});

// Cleanup on page unload
window.addEventListener('beforePageUnload', (e) => {
    if (e.detail.route === 'chat') {
        if (adminChatManager) {
            adminChatManager.destroy();
            adminChatManager = null;
        }
    }
});

async function initializeAdminChat() {
    try {
        // Get current admin user
        const user = getCurrentUser();
        if (!user) {
            showCustomAlert('Please login to access chat', 'Error');
            window.location.hash = 'login';
            return;
        }

        currentAdminPhone = user.mobile;
        
        console.log('🚀 Initializing Admin Chat with WebSocket...');
        
        // Initialize WebSocket ChatManager in admin mode
        if (typeof ChatManager === 'undefined') {
            console.error('❌ ChatManager not loaded. Make sure chat-manager-websocket.js is included.');
            showCustomAlert('Chat system not loaded. Please refresh the page.', 'Error');
            return;
        }
        
        // Create admin ChatManager (true = admin mode)
        if (!adminChatManager) {
            adminChatManager = new ChatManager(true);
            
            // Setup event listeners for incoming messages
            setupChatEventListeners();
            
            // Initialize WebSocket connection
            adminChatManager.initialize();
            console.log('✅ Admin WebSocket initialized');
        }
        
        // Load conversations list from REST API
        await loadConversations();

        // Setup search
        setupChatSearch();

    } catch (error) {
        console.error('Error initializing chat:', error);
        showCustomAlert('Error loading chat. Please refresh the page.', 'Error');
    }
}

function setupChatEventListeners() {
    // Listen for new messages
    window.addEventListener('chatMessage', (event) => {
        const { from, text, time } = event.detail;
        console.log('📨 Received message from:', from);
        
        // Add message to local storage
        allMessages.push({
            fromUser: from,
            toUser: currentAdminPhone,
            messageText: text,
            addDate: time || new Date().toISOString()
        });
        
        // If message is from current chat, update UI
        if (from === currentChatWithPhone) {
            renderMessages(allMessages.filter(m => 
                (m.fromUser === currentChatWithPhone && m.toUser === currentAdminPhone) ||
                (m.fromUser === currentAdminPhone && m.toUser === currentChatWithPhone)
            ));
            
            // Mark as read
            markMessagesAsRead(from);
        } else {
            // Update conversation list to show new message
            loadConversations();
        }
    });
    
    // Listen for message history
    window.addEventListener('chatHistory', (event) => {
        const { messages } = event.detail;
        console.log('📜 Received chat history:', messages.length, 'messages');
        
        // Store messages
        allMessages = messages.map(m => ({
            fromUser: m.from,
            toUser: m.to,
            messageText: m.text,
            addDate: m.time || new Date().toISOString()
        }));
        
        // Render if we're viewing this chat
        if (currentChatWithPhone) {
            const filteredMessages = allMessages.filter(m => 
                (m.fromUser === currentChatWithPhone && m.toUser === currentAdminPhone) ||
                (m.fromUser === currentAdminPhone && m.toUser === currentChatWithPhone)
            );
            renderMessages(filteredMessages);
        }
    });
    
    // Listen for message sent confirmation
    window.addEventListener('chatSent', (event) => {
        console.log('✅ Message sent successfully');
        // Message already added optimistically, just confirm
    });
    
    // Listen for unread count updates
    window.addEventListener('chatUnreadCount', (event) => {
        const { count } = event.detail;
        console.log('📬 Unread count:', count);
        // Update UI badge if needed
    });
}

async function loadConversations() {
    try {
        const response = await apiRequest(
            `${API_BASE_URL}/Chat/users?admnuser=${currentAdminPhone}`
        );

        if (response.success) {
            allConversations = response.data || [];
            renderConversations(allConversations);
        } else {
            throw new Error(response.message || 'Failed to load conversations');
        }
    } catch (error) {
        console.error('Error loading conversations:', error);
        document.getElementById('conversations-list').innerHTML = `
            <div style="padding: 40px 20px; text-align: center; color: #6b7280;">
                <p>Error loading conversations</p>
                <button onclick="loadConversations()" class="btn-icon" style="margin-top: 16px;">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
        `;
    }
}

function renderConversations(conversations) {
    const container = document.getElementById('conversations-list');

    if (!conversations || conversations.length === 0) {
        container.innerHTML = `
            <div style="padding: 40px 20px; text-align: center; color: #6b7280;">
                <p>No conversations yet</p>
            </div>
        `;
        return;
    }

    container.innerHTML = conversations.map(conv => {
        const initials = conv.userName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const isActive = currentChatWithPhone === conv.userId;
        const time = conv.lastMessageTime ? formatChatTime(new Date(conv.lastMessageTime)) : '';

        return `
            <div class="conversation-item ${isActive ? 'active' : ''}" 
                 onclick="openConversation('${conv.userId}', '${escapeHtml(conv.userName)}')">
                <div class="user-avatar-small">
                    <span>${initials}</span>
                </div>
                <div class="conversation-details">
                    <p class="conversation-name">${escapeHtml(conv.userName)}</p>
                    <p class="conversation-last-msg">${escapeHtml(conv.lastMessage || 'No messages yet')}</p>
                </div>
                <div class="conversation-meta">
                    ${time ? `<span class="conversation-time">${time}</span>` : ''}
                    ${conv.unreadCount > 0 ? `<span class="unread-badge">${conv.unreadCount}</span>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

async function openConversation(phone, userName) {
    currentChatWithPhone = phone;
    currentChatUserName = userName;

    console.log('📱 Opening conversation with:', userName, phone);

    // Show chat area, hide empty state
    document.getElementById('chat-empty-state').style.display = 'none';
    document.getElementById('chat-active').style.display = 'flex';

    // Update header
    document.getElementById('chat-username').textContent = userName;
    document.getElementById('chat-user-phone').textContent = phone;

    // Mobile: hide sidebar, show chat
    if (window.innerWidth < 768) {
        document.getElementById('chat-sidebar').classList.add('mobile-hidden');
        document.getElementById('chat-content').classList.add('mobile-active');
    }

    // Highlight active conversation
    renderConversations(allConversations);

    // Load messages via WebSocket
    if (adminChatManager) {
        // Select user in ChatManager
        adminChatManager.selectUser(phone, userName);
        
        // Request message history via WebSocket
        try {
            await adminChatManager.loadHistory(phone);
            console.log('📜 Requested message history for:', phone);
        } catch (error) {
            console.error('Error loading history:', error);
        }
    } else {
        console.error('❌ ChatManager not initialized');
        // Fallback to REST if WebSocket not available
        loadMessagesREST();
    }

    // Mark as read
    await markMessagesAsRead(phone);

    // Focus input
    document.getElementById('message-input')?.focus();
}

// Fallback REST method if WebSocket fails
async function loadMessagesREST() {
    if (!currentChatWithPhone) return;

    try {
        const response = await apiRequest(
            `${API_BASE_URL}/Chat/history?custno=${currentAdminPhone}&toUser=${currentChatWithPhone}`
        );

        if (response.success) {
            const messages = response.data || [];
            allMessages = messages;
            renderMessages(messages);
        }
    } catch (error) {
        console.error('Error loading messages:', error);
    }
}

function renderMessages(messages) {
    const container = document.getElementById('messages-container');

    if (!messages || messages.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #6b7280;">
                <p>No messages yet. Start the conversation!</p>
            </div>
        `;
        return;
    }

    let lastDate = null;
    let html = '';

    messages.forEach(msg => {
        const msgDate = new Date(msg.addDate);
        const dateStr = msgDate.toLocaleDateString('en-IN');

        // Add date divider
        if (dateStr !== lastDate) {
            html += `
                <div class="date-divider">
                    <span>${formatDateDivider(msgDate)}</span>
                </div>
            `;
            lastDate = dateStr;
        }

        const isSent = msg.fromUser === currentAdminPhone;
        const time = msgDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

        html += `
            <div class="message-bubble ${isSent ? 'sent' : 'received'}">
                ${!isSent ? `
                    <div class="message-avatar">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                ` : ''}
                <div class="message-content">
                    <p class="message-text">${escapeHtml(msg.messageText)}</p>
                    <span class="message-time">${time}</span>
                </div>
                 ${isSent ? `
                    <div class="message-avatar">
                        <span class="material-symbols-outlined">support_agent</span>
                    </div>
                ` : ''}
            </div>
        `;
    });

    container.innerHTML = html;

    // Scroll to bottom
    setTimeout(() => {
        const area = document.getElementById('chat-messages-area');
        area.scrollTop = area.scrollHeight;
    }, 100);
}

async function sendMessage(event) {
    event.preventDefault();

    if (!currentChatWithPhone) {
        showCustomAlert('Please select a conversation first', 'Error');
        return;
    }

    const input = document.getElementById('message-input');
    const message = input.value.trim();

    if (!message) return;

    const btn = document.getElementById('btn-send');
    btn.disabled = true;

    try {
        console.log('📤 Sending message to:', currentChatWithPhone);
        
        // Try WebSocket first
        if (adminChatManager && adminChatManager.connectionState === 'connected') {
            // Send via WebSocket
            const success = await adminChatManager.sendMessage(message, currentChatWithPhone);
            
            if (success) {
                // Add message optimistically to UI
                allMessages.push({
                    fromUser: currentAdminPhone,
                    toUser: currentChatWithPhone,
                    messageText: message,
                    addDate: new Date().toISOString()
                });
                
                // Update UI immediately
                const filteredMessages = allMessages.filter(m => 
                    (m.fromUser === currentChatWithPhone && m.toUser === currentAdminPhone) ||
                    (m.fromUser === currentAdminPhone && m.toUser === currentChatWithPhone)
                );
                renderMessages(filteredMessages);
                
                // Clear input
                input.value = '';
                input.focus();
                
                // Refresh conversation list
                await loadConversations();
            } else {
                throw new Error('WebSocket send failed');
            }
        } else {
            // Fallback to REST API
            console.log('⚠️ WebSocket not connected, using REST API');
            const response = await apiRequest(`${API_BASE_URL}/Chat/sendMessage`, {
                method: 'POST',
                body: JSON.stringify({
                    fromUser: currentAdminPhone,
                    toUser: currentChatWithPhone,
                    message: message
                })
            });

            if (response.success) {
                input.value = '';
                await loadMessagesREST();
                await loadConversations();
            } else {
                throw new Error(response.message || 'Failed to send message');
            }
        }
    } catch (error) {
        console.error('Error sending message:', error);
        showCustomAlert('Failed to send message. Please try again.', 'Error');
    } finally {
        btn.disabled = false;
    }
}

async function markMessagesAsRead(fromPhone) {
    try {
        await apiRequest(`${API_BASE_URL}/Chat/markRead?custno=${currentAdminPhone}&curuser=${fromPhone}`, {
            method: 'POST'
        });
        
        // Refresh conversations to update unread count
        await loadConversations();
    } catch (error) {
        console.error('Error marking messages as read:', error);
    }
}

function setupChatSearch() {
    const searchInput = document.getElementById('chat-search');
    searchInput?.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allConversations.filter(conv => 
            conv.userName.toLowerCase().includes(term) ||
            conv.userId.includes(term) ||
            (conv.lastMessage && conv.lastMessage.toLowerCase().includes(term))
        );
        renderConversations(filtered);
    });
}

function refreshChatUsers() {
    console.log('🔄 Refreshing conversations...');
    loadConversations();
}

function refreshMessages() {
    console.log('🔄 Refreshing messages...');
    if (currentChatWithPhone && adminChatManager) {
        adminChatManager.loadHistory(currentChatWithPhone);
    } else if (currentChatWithPhone) {
        loadMessagesREST();
    }
}

function closeChatMobile() {
    document.getElementById('chat-sidebar').classList.remove('mobile-hidden');
    document.getElementById('chat-content').classList.remove('mobile-active');
}

function toggleChatInfo() {
    const panel = document.getElementById('chat-info-panel');
    const container = document.querySelector('.chat-main-container');
    const isActive = panel.classList.contains('active');
    
    if (isActive) {
        panel.classList.remove('active');
        container.classList.remove('with-info-panel');
        if (window.innerWidth <= 768) {
            panel.classList.remove('mobile-visible');
        }
    } else {
        panel.classList.add('active');
        container.classList.add('with-info-panel');
        if (window.innerWidth <= 768) {
            panel.classList.add('mobile-visible');
        }
        
        // Update info panel with current user data
        updateInfoPanel();
    }
}

function updateInfoPanel() {
    if (!currentChatWithPhone) return;
    
    const conv = allConversations.find(c => c.userId === currentChatWithPhone);
    if (!conv) return;
    
    document.getElementById('info-username').textContent = conv.userName;
    document.getElementById('info-phone').textContent = currentChatWithPhone;
    document.getElementById('info-total-msgs').textContent = conv.totalMessages || '0';
    document.getElementById('info-unread').textContent = conv.unreadCount || '0';
}

// Utility functions
function formatChatTime(date) {
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (minutes < 1) return 'Just now';
    if (minutes < 60) return `${minutes}m`;
    if (hours < 24) return `${hours}h`;
    if (days < 7) return `${days}d`;
    return date.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
}

function formatDateDivider(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) return 'Today';
    if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return date.toLocaleDateString('en-IN', { month: 'long', day: 'numeric', year: 'numeric' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
