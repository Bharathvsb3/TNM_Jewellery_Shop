        transform: scale(0.9);
        opacity: 0;

        transform: scale(1);
        opacity: 1;

<script>
// Make functions globally accessible
let allProducts = [];

// Image upload and compression functions
function selectImage(imageNumber, useCamera) {
    if (useCamera) {
        // Use camera directly on mobile, or show camera stream on desktop
        if (isMobileDevice()) {
            // On mobile, use file input with capture attribute
            const fileInput = document.getElementById(`product-image${imageNumber}-file`);
            fileInput.setAttribute('capture', 'environment');
            fileInput.click();
            
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    await processImage(file, imageNumber);
                }
            };
        } else {
            // On desktop, use camera stream via getUserMedia
            openCameraStream(imageNumber);
        }
    } else {
        // Regular file picker
        const fileInput = document.getElementById(`product-image${imageNumber}-file`);
        fileInput.removeAttribute('capture');
        fileInput.click();
        
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                await processImage(file, imageNumber);
            }
        };
    }
}

function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

async function openCameraStream(imageNumber) {
    try {
        // Initialize with rear camera
        window.currentFacingMode = 'environment';
        
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: window.currentFacingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            } 
        });
        
        // Create modal with camera preview
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-4';
        modal.id = 'camera-modal';
        modal.innerHTML = `
            <div class="bg-surface-container-lowest rounded-xl max-w-2xl w-full overflow-hidden">
                <div class="p-4 bg-surface-container-low border-b border-outline-variant/10 flex items-center justify-between">
                    <h3 class="text-xl font-bold text-on-surface">📸 Camera</h3>
                    <div class="flex gap-2">
                        <button onclick="toggleFlash()" id="flash-btn" class="px-3 py-2 bg-surface-container-high hover:bg-primary text-on-surface hover:text-white rounded-lg transition-colors" title="Toggle Flash">
                            <span class="material-symbols-outlined">flash_off</span>
                        </button>
                        <button onclick="switchCamera()" class="px-3 py-2 bg-surface-container-high hover:bg-primary text-on-surface hover:text-white rounded-lg transition-colors" title="Switch Camera">
                            <span class="material-symbols-outlined">flip_camera_android</span>
                        </button>
                    </div>
                </div>
                <div class="relative bg-black">
                    <video id="camera-preview" autoplay playsinline class="w-full max-h-[60vh] object-contain"></video>
                    <canvas id="camera-canvas" class="hidden"></canvas>
                    
                    <!-- Zoom Controls -->
                    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-black/50 px-4 py-2 rounded-full">
                        <button onclick="adjustZoom(-0.5)" class="text-white hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" 
                               oninput="setZoom(this.value)" 
                               class="w-32 h-2 bg-white/30 rounded-lg appearance-none cursor-pointer">
                        <button onclick="adjustZoom(0.5)" class="text-white hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                        <span id="zoom-level" class="text-white text-sm min-w-[3rem] text-center">1.0x</span>
                    </div>
                </div>
                <div class="p-4 flex gap-3">
                    <button onclick="capturePhoto(${imageNumber})" class="flex-1 px-6 py-3 golden-gradient text-white text-sm uppercase tracking-widest font-bold flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">photo_camera</span>
                        Capture Photo
                    </button>
                    <button onclick="closeCameraStream()" class="flex-1 px-6 py-3 bg-error hover:bg-error/80 text-white text-sm uppercase tracking-widest font-bold transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        const video = document.getElementById('camera-preview');
        video.srcObject = stream;
        
        // Store stream and video track reference
        window.currentCameraStream = stream;
        window.currentImageNumber = imageNumber;
        window.currentVideoTrack = stream.getVideoTracks()[0];
        
        // Check if flash is supported
        const capabilities = window.currentVideoTrack.getCapabilities();
        if (capabilities.torch) {
            window.flashSupported = true;
        } else {
            const flashBtn = document.getElementById('flash-btn');
            if (flashBtn) flashBtn.style.display = 'none';
        }
        
    } catch (error) {
        console.error('Camera access error:', error);
        await showCustomAlert('Unable to access camera. Please check permissions or use "Select from Device" option.', 'Camera Error');
    }
}

async function capturePhoto(imageNumber) {
    const video = document.getElementById('camera-preview');
    const canvas = document.getElementById('camera-canvas');
    const context = canvas.getContext('2d');
    
    // Set canvas size to video size
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Draw video frame to canvas
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Convert to blob
    canvas.toBlob(async (blob) => {
        // Close camera stream
        closeCameraStream();
        
        // Process the captured image
        const file = new File([blob], `camera-photo-${Date.now()}.jpg`, { type: 'image/jpeg' });
        await processImage(file, imageNumber);
    }, 'image/jpeg', 0.9);
}

function closeCameraStream() {
    // Stop camera stream
    if (window.currentCameraStream) {
        window.currentCameraStream.getTracks().forEach(track => track.stop());
        window.currentCameraStream = null;
    }
    
    // Reset camera variables
    window.currentVideoTrack = null;
    window.currentFacingMode = 'environment';
    window.flashEnabled = false;
    window.flashSupported = false;
    
    // Remove modal
    const modal = document.getElementById('camera-modal');
    if (modal) modal.remove();
}

// Switch between front and rear camera
async function switchCamera() {
    try {
        // Toggle facing mode
        window.currentFacingMode = window.currentFacingMode === 'environment' ? 'user' : 'environment';
        
        // Stop current stream
        if (window.currentCameraStream) {
            window.currentCameraStream.getTracks().forEach(track => track.stop());
        }
        
        // Get new stream with switched camera
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: window.currentFacingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            } 
        });
        
        // Update video element
        const video = document.getElementById('camera-preview');
        video.srcObject = stream;
        
        // Update stream references
        window.currentCameraStream = stream;
        window.currentVideoTrack = stream.getVideoTracks()[0];
        
        // Reset zoom
        const zoomSlider = document.getElementById('zoom-slider');
        if (zoomSlider) {
            zoomSlider.value = 1;
            setZoom(1);
        }
        
        // Check flash support for new camera
        const capabilities = window.currentVideoTrack.getCapabilities();
        const flashBtn = document.getElementById('flash-btn');
        if (capabilities.torch) {
            window.flashSupported = true;
            if (flashBtn) flashBtn.style.display = 'block';
        } else {
            window.flashSupported = false;
            window.flashEnabled = false;
            if (flashBtn) {
                flashBtn.style.display = 'none';
                flashBtn.querySelector('.material-symbols-outlined').textContent = 'flash_off';
            }
        }
    } catch (error) {
        console.error('Error switching camera:', error);
        await showCustomAlert('Unable to switch camera. Please try again.', 'Camera Error');
    }
}

// Toggle flash/torch
async function toggleFlash() {
    if (!window.flashSupported || !window.currentVideoTrack) return;
    
    try {
        window.flashEnabled = !window.flashEnabled;
        
        await window.currentVideoTrack.applyConstraints({
            advanced: [{ torch: window.flashEnabled }]
        });
        
        // Update button icon
        const flashBtn = document.getElementById('flash-btn');
        const icon = flashBtn.querySelector('.material-symbols-outlined');
        icon.textContent = window.flashEnabled ? 'flash_on' : 'flash_off';
        
        if (window.flashEnabled) {
            flashBtn.classList.add('bg-primary', 'text-white');
            flashBtn.classList.remove('bg-surface-container-high', 'text-on-surface');
        } else {
            flashBtn.classList.remove('bg-primary', 'text-white');
            flashBtn.classList.add('bg-surface-container-high', 'text-on-surface');
        }
    } catch (error) {
        console.error('Error toggling flash:', error);
    }
}

// Set zoom level
function setZoom(value) {
    if (!window.currentVideoTrack) return;
    
    const capabilities = window.currentVideoTrack.getCapabilities();
    if (!capabilities.zoom) return;
    
    const zoomValue = parseFloat(value);
    
    try {
        window.currentVideoTrack.applyConstraints({
            advanced: [{ zoom: zoomValue }]
        });
        
        document.getElementById('zoom-level').textContent = zoomValue.toFixed(1) + 'x';
    } catch (error) {
        console.error('Error applying zoom:', error);
    }
}

// Adjust zoom incrementally
function adjustZoom(delta) {
    const slider = document.getElementById('zoom-slider');
    if (!slider) return;
    
    const currentZoom = parseFloat(slider.value);
    const newZoom = Math.max(1, Math.min(5, currentZoom + delta));
    
    slider.value = newZoom;
    setZoom(newZoom);
}

async function processImage(file, imageNumber) {
    try {
        // Compress the image
        const compressedDataUrl = await compressImage(file);
        
        // Show preview
        const previewDiv = document.getElementById(`preview${imageNumber}`);
        const previewImg = document.getElementById(`preview${imageNumber}-img`);
        const hiddenInput = document.getElementById(`product-image${imageNumber}`);
        
        previewImg.src = compressedDataUrl;
        previewDiv.classList.remove('hidden');
        hiddenInput.value = compressedDataUrl;
        
    } catch (error) {
        console.error('Error processing image:', error);
        await showCustomAlert('Failed to process image. Please try again.', 'Error');
    }
}

async function compressImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = (e) => {
            const img = new Image();
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set max dimensions
                const maxWidth = 800;
                const maxHeight = 800;
                let width = img.width;
                let height = img.height;
                
                // Calculate new dimensions while maintaining aspect ratio
                if (width > height) {
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width *= maxHeight / height;
                        height = maxHeight;
                    }
                }
                
                canvas.width = width;
                canvas.height = height;
                
                // Draw image on canvas
                ctx.drawImage(img, 0, 0, width, height);
                
                // Add watermark
                const fontSize = Math.max(12, Math.min(width, height) * 0.04);
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                
                // Background for watermark
                const text = 'JMW Jewellery';
                const textMetrics = ctx.measureText(text);
                const padding = fontSize * 0.4;
                ctx.fillRect(
                    padding, 
                    height - fontSize - padding * 2, 
                    textMetrics.width + padding * 2, 
                    fontSize + padding * 2
                );
                
                // Watermark text
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillText(text, padding * 2, height - padding);
                
                // Convert to base64 with compression (quality: 0.8)
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                
                // Log compression results
                const originalSize = (file.size / 1024).toFixed(2);
                const compressedSize = (compressedDataUrl.length * 0.75 / 1024).toFixed(2);
                console.log(`Image compressed: ${originalSize}KB → ${compressedSize}KB`);
                
                resolve(compressedDataUrl);
            };
            
            img.onerror = () => reject(new Error('Failed to load image'));
            img.src = e.target.result;
        };
        
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(file);
    });
}

function setupProductFilters() {
    const searchInput = document.getElementById('product-search');
    const categoryFilter = document.getElementById('product-category-filter');
    const metalFilter = document.getElementById('product-metal-filter');
    const statusFilter = document.getElementById('product-status-filter');
    
    const applyFilters = () => {
        const search = searchInput.value.toLowerCase();
        const category = categoryFilter.value;
        const metal = metalFilter.value;
        const status = statusFilter.value;
        
        let filtered = allProducts;
        
        if (search) {
            filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
        }
        
        if (category !== 'all') {
            filtered = filtered.filter(p => p.category === category);
       }
        
        if (metal !== 'all') {
            filtered = filtered.filter(p => p.metalType === metal);
        }
        
        if (status !== 'all') {
            filtered = filtered.filter(p => 
                status === 'active' ? p.isActive : !p.isActive
            );
        }
        
        renderProducts(filtered);
    };
    
    searchInput.addEventListener('input', applyFilters);
    categoryFilter.addEventListener('change', applyFilters);
    metalFilter.addEventListener('change', applyFilters);
    statusFilter.addEventListener('change', applyFilters);
}

// Handle metal type change - auto-select purity

    const metal = document.getElementById('product-metal').value;
    const puritySelect = document.getElementById('product-purity');
    
    if (metal === 'Gold') {
        // Default to 22K (916) for Gold
        puritySelect.value = '916';
    } else if (metal === 'Silver') {
        // Auto-select 925 for Silver
        puritySelect.value = '925';
    } else if (metal === 'Platinum') {
        // Platinum typically 950
        puritySelect.value = '950';
    }
}

// Handle purity change - auto-select metal
function handleProductPurityChange() {
    const purity = document.getElementById('product-purity').value;
    const metalSelect = document.getElementById('product-metal');
    
    if (purity === '925') {
        // 925 is Sterling Silver
        metalSelect.value = 'Silver';
    } else if (purity === '999' || purity === '916') {
        // 999 and 916 are Gold purities
        metalSelect.value = 'Gold';
    } else if (purity === '950') {
        // 950 is Platinum
        metalSelect.value = 'Platinum';
    }
}

window.changeSlide = function(direction) {
    const slides = document.querySelectorAll('.carousel-slide');
    const indicators = document.querySelectorAll('.slide-indicator');
    if (slides.length === 0) return;
    
    // Initialize if needed
    if (typeof window.currentSlide === 'undefined' || window.currentSlide === null) {
        window.currentSlide = 0;
    }
    
    slides[window.currentSlide].classList.remove('opacity-100');
    slides[window.currentSlide].classList.add('opacity-0');
    if (indicators[window.currentSlide]) {
        indicators[window.currentSlide].classList.remove('bg-white', 'w-6');
        indicators[window.currentSlide].classList.add('bg-white/50');
    }
    
    window.currentSlide = (window.currentSlide + direction + slides.length) % slides.length;
    
    slides[window.currentSlide].classList.remove('opacity-0');
    slides[window.currentSlide].classList.add('opacity-100');
    if (indicators[window.currentSlide]) {
        indicators[window.currentSlide].classList.remove('bg-white/50');
        indicators[window.currentSlide].classList.add('bg-white', 'w-6');
    }
}

window.goToSlide = function(index) {
    const slides = document.querySelectorAll('.carousel-slide');
    const indicators = document.querySelectorAll('.slide-indicator');
    if (slides.length === 0) return;
    
    // Initialize if needed
    if (typeof window.currentSlide === 'undefined' || window.currentSlide === null) {
        window.currentSlide = 0;
    }
    
    slides[window.currentSlide].classList.remove('opacity-100');
    slides[window.currentSlide].classList.add('opacity-0');
    if (indicators[window.currentSlide]) {
        indicators[window.currentSlide].classList.remove('bg-white', 'w-6');
        indicators[window.currentSlide].classList.add('bg-white/50');
    }
    
    window.currentSlide = index;
    
    slides[window.currentSlide].classList.remove('opacity-0');
    slides[window.currentSlide].classList.add('opacity-100');
    if (indicators[window.currentSlide]) {
        indicators[window.currentSlide].classList.remove('bg-white/50');
        indicators[window.currentSlide].classList.add('bg-white', 'w-6');
    }
}

function closeViewModal() {
    const modal = document.getElementById('view-product-modal');
    if (modal) {
        // Clear carousel interval
        if (window.carouselInterval) {
            clearInterval(window.carouselInterval);
            window.carouselInterval = null;
        }
        modal.remove();
    }
}

async function toggleProductStatus(id, newStatus) {
    const action = newStatus ? 'activate' : 'deactivate';
    const confirmed = await showCustomConfirm(
        `Are you sure you want to ${action} this product?`,
        'Confirm Status Change'
    );
    if (!confirmed) {
        return;
    }
    
    try {
        await apiRequest(`${API_BASE_URL}/Products/${id}/status`, {
            method: 'PUT',
            body: JSON.stringify({ isActive: newStatus })
        });
        await loadProducts();
    } catch (error) {
        console.error('Error updating product status:', error);
        await showCustomAlert('Failed to update product status. Please try again.', 'Error');
    }
}

async function deleteProduct(id, name) {
    const confirmed = await showCustomConfirm(
        `⚠️ Are you sure you want to delete "${name}"?\n\nThis action cannot be undone.`,
        'Delete Product'
    );
    if (!confirmed) {
        return;
    }
    
    const confirmText = await showCustomPrompt(
        `Type "${name}" to confirm deletion:`,
        'Confirm Deletion'
    );
    if (confirmText !== name) {
        await showCustomAlert('Deletion cancelled. Name did not match.', 'Cancelled');
        return;
    }
    
    try {
        await apiRequest(`${API_BASE_URL}/Products/${id}`, {
            method: 'DELETE'
        });
        await showCustomAlert(`✅ "${name}" has been deleted successfully.`, 'Success');
        await loadProducts();
    } catch (error) {
        console.error('Error deleting product:', error);
        await showCustomAlert('❌ Failed to delete product. Please try again.', 'Error');
    }
}

function setupProductFormHandler() {
    const form = document.getElementById('product-form');
    if (!form) return;
    
    // Setup metal type theme changer
    const metalSelect = document.getElementById('product-metal');
    if (metalSelect) {
        handleMetalTypeChange(metalSelect, '#product-form');
    }
    
    form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const id = document.getElementById('product-id').value;
    const quantityValue = document.getElementById('product-quantity').value;
    const purityValue = document.getElementById('product-purity').value;
    const wastageValue = document.getElementById('product-wastage').value;
    const makingChargesValue = document.getElementById('product-making-charges').value;
    const gstValue = document.getElementById('product-gst').value;
    
    const data = {
        name: document.getElementById('product-name').value,
        jewelryType: document.getElementById('product-jewelry-type').value || null,
        category: document.getElementById('product-category').value,
        metalType: document.getElementById('product-metal').value,
        purity: purityValue ? parseInt(purityValue) : null,
        weight: parseFloat(document.getElementById('product-weight').value),
        wastage: wastageValue ? parseFloat(wastageValue) : null,
        makingCharges: makingChargesValue ? parseFloat(makingChargesValue) : null,
        gst: gstValue ? parseFloat(gstValue) : null,
        quantity: quantityValue ? parseInt(quantityValue) : null,
        stoneDetails: document.getElementById('product-stone-details').value || null,
        description: document.getElementById('product-description').value || null,
        image1: document.getElementById('product-image1').value || null,
        image2: document.getElementById('product-image2').value || null,
        image3: document.getElementById('product-image3').value || null,
        isActive: document.getElementById('product-is-active').value === 'true'
    };
    
    try {
        if (id) {
            await apiRequest(`${API_BASE_URL}/Products/${id}`, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
        } else {
            await apiRequest(`${API_BASE_URL}/Products`, {
                method: 'POST',
                body: JSON.stringify(data)
            });
        }
        
        hideProductModal();
        await loadProducts();
    } catch (error) {
        console.error('Error saving product:', error);
        await showCustomAlert('Failed to save product. Please try again.', 'Error');
    }
    });
}
