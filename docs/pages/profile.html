<div class="profile-page">
    <div class="grid grid-2">
        <!-- Profile Info -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Profile Information</h3>
            </div>
            <div class="card-body">
                <div class="text-center mb-3">
                    <div style="width:100px; height:100px; margin:0 auto; background:linear-gradient(135deg, var(--blue-primary), var(--blue-light)); border-radius:50%; display:flex; align-items:center; justify-content:center;">
                        <span class="material-symbols-outlined" style="font-size:64px; color:white;">account_circle</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="profile-name" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile</label>
                    <input type="text" class="form-control" id="profile-mobile" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="profile-email" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <input type="text" class="form-control" id="profile-role" readonly>
                </div>
            </div>
        </div>

        <!-- Change Password -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Change Password</h3>
            </div>
            <div class="card-body">
                <form id="change-password-form">
                    <div class="form-group">
                        <label class="form-label">Current Password</label>
                        <input type="password" class="form-control" id="current-password" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new-password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm-new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span class="material-symbols-outlined">lock_reset</span> Change Password
                    </button>
                    <p id="password-error" class="error-message"></p>
                </form>
            </div>
        </div>

        <!-- Logout Section -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Account Actions</h3>
            </div>
            <div class="card-body">
                <p style="margin-bottom: 1rem; color: #666;">Log out from your account securely</p>
                <button onclick="logoutAdmin()" class="btn" style="background: linear-gradient(135deg, #dc3545, #c82333); color: white; width: 100%;">
                    <span class="material-symbols-outlined">logout</span> Logout
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Custom Confirm Dialog
function showConfirmDialog(title, message) {
    return new Promise((resolve) => {
        const modal = document.createElement('div');
        modal.className = 'fixed inset-0 bg-black/50 z-[200] flex items-center justify-center p-4';
        modal.innerHTML = `
            <div class="bg-surface-container-lowest rounded-xl max-w-md w-full animate-scale-in">
                <div class="bg-primary px-8 py-6 rounded-t-xl">
                    <h3 class="text-xl font-bold text-white">${title}</h3>
                </div>
                <div class="p-8">
                    <p class="text-on-surface whitespace-pre-wrap">${message}</p>
                </div>
                <div class="flex gap-4 p-6 border-t border-outline-variant/20">
                    <button class="flex-1 px-6 py-3 border-2 border-outline-variant hover:bg-surface-container-low rounded-lg font-bold transition-colors cancel-btn">
                        Cancel
                    </button>
                    <button class="flex-1 px-6 py-3 bg-primary hover:bg-primary-container text-white rounded-lg font-bold transition-colors confirm-btn">
                        Confirm
                    </button>
                </div>
            </div>
        `;
        
        modal.querySelector('.cancel-btn').onclick = () => {
            modal.remove();
            resolve(false);
        };
        modal.querySelector('.confirm-btn').onclick = () => {
            modal.remove();
            resolve(true);
        };
        modal.onclick = (e) => {
            if (e.target === modal) {
                modal.remove();
                resolve(false);
            }
        };
        
        document.body.appendChild(modal);
    });
}

window.addEventListener('pageLoaded', (e) => {
    if (e.detail.route === 'profile') {
        loadProfile();
    }
});

function loadProfile() {
    const user = getCurrentUser();
    if (user) {
        document.getElementById('profile-name').value = user.name;
        document.getElementById('profile-mobile').value = user.mobile;
        document.getElementById('profile-email').value = user.email || '-';
        document.getElementById('profile-role').value = user.role;
    }
}

document.getElementById('change-password-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const errorEl = document.getElementById('password-error');
    errorEl.textContent = '';

    const currentPassword = document.getElementById('current-password').value;
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-new-password').value;

    if (newPassword !== confirmPassword) {
        errorEl.textContent = 'New passwords do not match';
        return;
    }

    try {
        await apiRequest(API.AUTH.CHANGE_PASSWORD, {
            method: 'POST',
            body: JSON.stringify({
                currentPassword,
                newPassword
            })
        });

        showToast('Password changed successfully');
        document.getElementById('change-password-form').reset();
    } catch (error) {
        errorEl.textContent = error.message || 'Error changing password';
    }
});

function logoutAdmin() {
    const confirmed = await showConfirmDialog('Confirm Logout', 'Are you sure you want to logout?');
    if (confirmed) {
        localStorage.clear();
        window.location.href = 'index.html';
    }
}
</script>
