<div class="chat-page">
    <div class="chat-container">
        <!-- Users List (Left Panel) -->
        <div class="chat-users-panel">
            <div class="chat-panel-header">
                <h3>Conversations</h3>
                <button class="btn btn-sm btn-primary" onclick="refreshUsers()">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
            <div class="user-search">
                <input type="text" class="form-control" placeholder="Search users..." id="user-search">
            </div>
            <div class="users-list" id="users-list">
                Loading users...
            </div>
        </div>

        <!-- Chat Window (Right Panel) -->
        <div class="chat-window-panel">
            <div class="chat-empty-state" id="empty-state">
                <span class="material-symbols-outlined" style="font-size:64px;color:var(--gray-400);">chat</span>
                <h3>Select a conversation</h3>
                <p class="text-muted">Choose a user from the list to start chatting</p>
            </div>

            <div class="chat-active-window" id="active-chat" style="display:none;">
                <!-- Chat Header -->
                <div class="chat-window-header">
                    <div class="chat-user-info">
                        <div class="user-avatar">
                            <span class="material-symbols-outlined">account_circle</span>
                        </div>
                        <div>
                            <h4 id="chat-user-name">User Name</h4>
                            <small class="text-muted" id="chat-user-role">Role</small>
                        </div>
                    </div>
                    <div style="display:flex;gap:0.5rem;">
                        <button class="btn btn-sm btn-outline" id="view-chat-btn" onclick="setChatView('chat')" title="Chat View">
                            <span class="material-symbols-outlined">chat_bubble</span>
                        </button>
                        <button class="btn btn-sm btn-outline" id="view-table-chat-btn" onclick="setChatView('table')" title="Table View">
                            <span class="material-symbols-outlined">table_chart</span>
                        </button>
                        <button class="btn btn-sm btn-outline" id="view-stats-btn" onclick="setChatView('stats')" title="Statistics">
                            <span class="material-symbols-outlined">analytics</span>
                        </button>
                        <button class="btn btn-sm btn-outline" onclick="closeChat()">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                </div>

                <!-- Chat View (Default) -->
                <div id="chat-view" class="chat-view-container">
                    <!-- Messages Area -->
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages will be loaded here -->
                    </div>

                    <!-- Message Input -->
                    <div class="chat-input-area">
                        <form id="message-form" class="flex gap-2">
                            <input 
                                type="text" 
                                class="form-control" 
                                id="message-input" 
                                placeholder="Type your message..." 
                                required
                                autocomplete="off">
                            <button type="submit" class="btn btn-primary">
                                <span class="material-symbols-outlined">send</span> Send
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Table View -->
                <div id="table-chat-view" class="chat-view-container" style="display:none;">
                    <div class="p-4" style="flex:1;overflow-y:auto;">
                        <table class="table" style="width:100%;">
                            <thead style="position:sticky;top:0;background:white;z-index:1;">
                                <tr>
                                    <th style="padding:0.75rem;border-bottom:2px solid var(--gray-200);">Time</th>
                                    <th style="padding:0.75rem;border-bottom:2px solid var(--gray-200);">From</th>
                                    <th style="padding:0.75rem;border-bottom:2px solid var(--gray-200);">Message</th>
                                    <th style="padding:0.75rem;border-bottom:2px solid var(--gray-200);">Status</th>
                                </tr>
                            </thead>
                            <tbody id="chat-table-body">
                                <tr><td colspan="4" class="text-center" style="padding:2rem;">Loading messages...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Statistics View -->
                <div id="stats-view" class="chat-view-container" style="display:none;">
                    <div class="p-4" style="flex:1;overflow-y:auto;">
                        <!-- Stats Cards -->
                        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem;">
                            <div class="stat-card">
                                <div class="stat-value" id="total-messages">0</div>
                                <div class="stat-label">Total Messages</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="messages-sent">0</div>
                                <div class="stat-label">Sent by You</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="messages-received">0</div>
                                <div class="stat-label">Received</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="avg-response-time">-</div>
                                <div class="stat-label">Avg Response Time</div>
                            </div>
                        </div>

                        <!-- Chart -->
                        <div class="card" style="padding:1.5rem;">
                            <h4 style="margin-bottom:1rem;">Message Activity</h4>
                            <canvas id="chat-stats-chart" width="400" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

<script>
let allUsers = [];
let currentChatUser = null;
let messagePollingInterval = null;
let currentUserId = null;
let currentMessages = [];
let currentChatView = 'chat';

window.addEventListener('pageLoaded', async (e) => {
    if (e.detail.route === 'chat') {
        currentUserId = getCurrentUser()?.id;
        await loadUsers();
        setupUserSearch();
    }
});

async function loadUsers() {
    try {
        // Get all users except current user
        const users = await apiRequest(API.CUSTOMERS); // or a dedicated users endpoint
        allUsers = users?.filter(u => u.id !== currentUserId) || [];
        renderUsersList(allUsers);
    } catch (error) {
        console.error('Error loading users:', error);
        document.getElementById('users-list').innerHTML = '<p class="text-center text-muted" style="padding:2rem;">Error loading users</p>';
    }
}

function renderUsersList(users) {
    const list = document.getElementById('users-list');
    
    if (!users || users.length === 0) {
        list.innerHTML = '<p class="text-center text-muted" style="padding:2rem;">No users available</p>';
        return;
    }

    list.innerHTML = users.map(user => `
        <div class="user-item" onclick="openChat(${user.id}, '${user.name}', 'Customer')">
            <div class="user-avatar">
                <span class="material-symbols-outlined">account_circle</span>
            </div>
            <div class="user-details">
                <div class="user-name">${user.name}</div>
                <div class="user-last-message">${user.mobile}</div>
            </div>
        </div>
    `).join('');
}

function setupUserSearch() {
    document.getElementById('user-search')?.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filtered = allUsers.filter(u => 
            u.name.toLowerCase().includes(searchTerm) ||
            u.mobile.includes(searchTerm)
        );
        renderUsersList(filtered);
    });
}

async function openChat(userId, userName, userRole) {
    currentChatUser = userId;
    currentChatView = 'chat';
    
    // Update UI
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('active-chat').style.display = 'flex';
    document.getElementById('chat-user-name').textContent = userName;
    document.getElementById('chat-user-role').textContent = userRole;

    // Set initial view
    setChatView('chat');

    // Highlight active user
    document.querySelectorAll('.user-item').forEach(item => item.classList.remove('active'));
    event.currentTarget?.classList.add('active');

    // Load messages
    await loadMessages();

    // Start polling for new messages
    if (messagePollingInterval) {
        clearInterval(messagePollingInterval);
    }
    messagePollingInterval = setInterval(loadMessages, 5000); // Poll every 5 seconds
}

async function loadMessages() {
    if (!currentChatUser) return;

    try {
        const messages = await apiRequest(`${API.MESSAGES}/conversation/${currentChatUser}`);
        currentMessages = messages || [];
        
        // Render based on current view
        if (currentChatView === 'chat') {
            renderMessages(currentMessages);
        } else if (currentChatView === 'table') {
            renderTableView(currentMessages);
        } else if (currentChatView === 'stats') {
            renderStatsView(currentMessages);
        }
    } catch (error) {
        console.error('Error loading messages:', error);
    }
}

function setChatView(view) {
    currentChatView = view;
    
    // Hide all views
    document.getElementById('chat-view').style.display = 'none';
    document.getElementById('table-chat-view').style.display = 'none';
    document.getElementById('stats-view').style.display = 'none';
    
    // Remove active class from all buttons
    document.getElementById('view-chat-btn').classList.remove('active');
    document.getElementById('view-table-chat-btn').classList.remove('active');
    document.getElementById('view-stats-btn').classList.remove('active');
    
    // Show selected view
    if (view === 'chat') {
        document.getElementById('chat-view').style.display = 'flex';
        document.getElementById('view-chat-btn').classList.add('active');
        renderMessages(currentMessages);
    } else if (view === 'table') {
        document.getElementById('table-chat-view').style.display = 'flex';
        document.getElementById('view-table-chat-btn').classList.add('active');
        renderTableView(currentMessages);
    } else if (view === 'stats') {
        document.getElementById('stats-view').style.display = 'flex';
        document.getElementById('view-stats-btn').classList.add('active');
        renderStatsView(currentMessages);
    }
}

function renderTableView(messages) {
    const tbody = document.getElementById('chat-table-body');
    
    if (messages.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="padding:2rem;">No messages yet</td></tr>';
        return;
    }

    tbody.innerHTML = messages.map(msg => {
        const isSent = msg.senderId === currentUserId;
        const time = new Date(msg.sentAt).toLocaleString('en-IN');
        const from = isSent ? 'You' : document.getElementById('chat-user-name').textContent;
        const status = msg.isRead ? '✓✓ Read' : '✓ Sent';
        
        return `
            <tr>
                <td style="padding:0.75rem;border-bottom:1px solid var(--gray-100);white-space:nowrap;">${time}</td>
                <td style="padding:0.75rem;border-bottom:1px solid var(--gray-100);font-weight:${isSent ? 'bold' : 'normal'};">${from}</td>
                <td style="padding:0.75rem;border-bottom:1px solid var(--gray-100);">${msg.messageText}</td>
                <td style="padding:0.75rem;border-bottom:1px solid var(--gray-100);color:${msg.isRead ? 'var(--success)' : 'var(--gray-500)'};">${status}</td>
            </tr>
        `;
    }).join('');
}

function renderStatsView(messages) {
    const total = messages.length;
    const sent = messages.filter(m => m.senderId === currentUserId).length;
    const received = total - sent;
    
    let avgTime = '-';
    if (messages.length > 1) {
        const times = [];
        for (let i = 1; i < messages.length; i++) {
            const diff = new Date(messages[i].sentAt) - new Date(messages[i-1].sentAt);
            times.push(diff);
        }
        const avgMs = times.reduce((a, b) => a + b, 0) / times.length;
        const avgMins = Math.round(avgMs / 60000);
        avgTime = avgMins < 60 ? `${avgMins}m` : `${Math.round(avgMins / 60)}h`;
    }
    
    document.getElementById('total-messages').textContent = total;
    document.getElementById('messages-sent').textContent = sent;
    document.getElementById('messages-received').textContent = received;
    document.getElementById('avg-response-time').textContent = avgTime;
    
    renderChatChart(messages);
}

function renderChatChart(messages) {
    const canvas = document.getElementById('chat-stats-chart');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const messagesByDate = {};
    messages.forEach(msg => {
        const date = new Date(msg.sentAt).toLocaleDateString('en-IN');
        if (!messagesByDate[date]) {
            messagesByDate[date] = { sent: 0, received: 0 };
        }
        if (msg.senderId === currentUserId) {
            messagesByDate[date].sent++;
        } else {
            messagesByDate[date].received++;
        }
    });
    
    const dates = Object.keys(messagesByDate).slice(-7);
    const sentData = dates.map(d => messagesByDate[d].sent);
    const receivedData = dates.map(d => messagesByDate[d].received);
    
    if (dates.length === 0) {
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#999';
        ctx.textAlign = 'center';
        ctx.fillText('No data to display', canvas.width / 2, canvas.height / 2);
        return;
    }
    
    const padding = 50;
    const chartWidth = canvas.width - 2 * padding;
    const chartHeight = canvas.height - 2 * padding;
    const maxValue = Math.max(...sentData, ...receivedData, 1);
    const barWidth = chartWidth / (dates.length * 2 + 1);
    
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(padding, padding);
    ctx.lineTo(padding, canvas.height - padding);
    ctx.lineTo(canvas.width - padding, canvas.height - padding);
    ctx.stroke();
    
    dates.forEach((date, i) => {
        const x = padding + (i * 2 + 0.5) * barWidth;
        
        const sentHeight = (sentData[i] / maxValue) * chartHeight;
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(x, canvas.height - padding - sentHeight, barWidth * 0.8, sentHeight);
        
        const receivedHeight = (receivedData[i] / maxValue) * chartHeight;
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(x + barWidth, canvas.height - padding - receivedHeight, barWidth * 0.8, receivedHeight);
        
        ctx.fillStyle = '#666';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(date.split('/').slice(0, 2).join('/'), x + barWidth, canvas.height - padding + 20);
    });
    
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(canvas.width - padding - 100, 20, 20, 10);
    ctx.fillStyle = '#000';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Sent', canvas.width - padding - 75, 28);
    
    ctx.fillStyle = '#4a90e2';
    ctx.fillRect(canvas.width - padding - 100, 35, 20, 10);
    ctx.fillStyle = '#000';
    ctx.fillText('Received', canvas.width - padding - 75, 43);
}

function renderMessages(messages) {
    const container = document.getElementById('chat-messages');
    
    if (messages.length === 0) {
        container.innerHTML = '<p class="text-center text-muted">No messages yet. Start the conversation!</p>';
        return;
    }

    container.innerHTML = messages.map(msg => {
        const isSent = msg.senderId === currentUserId;
        return `
            <div class="message ${isSent ? 'sent' : 'received'}">
                <div class="message-avatar">
                    <span class="material-symbols-outlined">account_circle</span>
                </div>
                <div class="message-content">
                    <div class="message-text">${msg.messageText}</div>
                    <div class="message-time">${formatMessageTime(msg.sentAt)}</div>
                </div>
            </div>
        `;
    }).join('');

    // Scroll to bottom
    container.scrollTop = container.scrollHeight;

    // Mark messages as read
    messages.filter(m => m.receiverId === currentUserId && !m.isRead).forEach(m => {
        markAsRead(m.id);
    });
}

function formatMessageTime(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins}m ago`;
    
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h ago`;

    return formatDate(dateString);
}

async function markAsRead(messageId) {
    try {
        await apiRequest(`${API.MESSAGES}/${messageId}/read`, {
            method: 'POST'
        });
    } catch (error) {
        // Silent fail
    }
}

document.getElementById('message-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!currentChatUser) return;

    const input = document.getElementById('message-input');
    const messageText = input.value.trim();

    if (!messageText) return;

    try {
        await apiRequest(API.MESSAGES, {
            method: 'POST',
            body: JSON.stringify({
                receiverId: currentChatUser,
                messageText
            })
        });

        input.value = '';
        await loadMessages();
    } catch (error) {
        showToast('Error sending message', 'error');
    }
});

function closeChat() {
    document.getElementById('empty-state').style.display = 'flex';
    document.getElementById('active-chat').style.display = 'none';
    currentChatUser = null;
    currentMessages = [];
    
    if (messagePollingInterval) {
        clearInterval(messagePollingInterval);
        messagePollingInterval = null;
    }
    
    document.querySelectorAll('.user-item').forEach(item => item.classList.remove('active'));
}

function refreshUsers() {
    loadUsers();
    showToast('Users list refreshed');
}

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (messagePollingInterval) {
        clearInterval(messagePollingInterval);
    }
});
</script>
