<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Craftsman Login - JMW</title>
    <link rel="stylesheet" href="css/responsive-fix.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/premium-theme.css">
</head>
<body class="bg-surface font-body min-h-screen flex items-center justify-center p-4">
    <div class="container mx-auto max-w-md">
        <div class="bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden border border-outline-variant/10">
            <!-- Header with Logo -->
            <div class="bg-gradient-to-br from-primary via-primary-container to-tertiary p-8 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-black/10"></div>
                <div class="relative z-10">
                    <div class="w-20 h-20 mx-auto mb-4 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-5xl text-white">engineering</span>
                    </div>
                    <h1 class="text-3xl font-bold text-white serif-font mb-2">Craftsman Portal</h1>
                    <p class="text-white/90 text-sm">Access your assigned orders</p>
                </div>
            </div>

            <!-- Login Form -->
            <div class="p-8">
                <form id="craftsman-login-form" class="space-y-6">
                    <div>
                        <label for="mobile" class="block text-sm font-bold text-primary uppercase tracking-wider mb-2">
                            <span class="material-symbols-outlined text-sm align-middle">phone</span>
                            Mobile Number
                        </label>
                        <input 
                            type="tel" 
                            id="mobile" 
                            name="mobile" 
                            required 
                            pattern="[0-9]{10}"
                            maxlength="10"
                            placeholder="Enter 10-digit mobile number"
                            class="w-full px-4 py-3 bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg transition-all duration-300"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-bold text-primary uppercase tracking-wider mb-2">
                            <span class="material-symbols-outlined text-sm align-middle">lock</span>
                            Password
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required
                                placeholder="Enter password"
                                class="w-full px-4 py-3 bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg transition-all duration-300"
                            >
                            <button 
                                type="button" 
                                onclick="togglePassword()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors"
                            >
                                <span class="material-symbols-outlined" id="toggle-icon">visibility</span>
                            </button>
                        </div>
                    </div>

                    <div id="error-message" class="hidden bg-error/10 border border-error/30 text-error px-4 py-3 rounded-lg text-sm flex items-start gap-2">
                        <span class="material-symbols-outlined text-lg">error</span>
                        <span id="error-text"></span>
                    </div>

                    <button 
                        type="submit" 
                        class="w-full px-6 py-4 golden-gradient text-white text-sm uppercase tracking-widest font-bold shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 transition-all duration-300"
                    >
                        <span class="material-symbols-outlined text-sm align-middle mr-2">login</span>
                        Login to Portal
                    </button>
                </form>

                <!-- Back to Home -->
                <div class="mt-6 text-center">
                    <a href="index.html" class="text-sm text-outline hover:text-primary transition-colors inline-flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">arrow_back</span>
                        Back to Main Site
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check if already logged in as craftsman
        (function checkAuth() {
            const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
            const userStr = localStorage.getItem(STORAGE_KEYS.USER);
            
            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    // If logged in as craftsman, redirect to work page
                    if (user.userType === 'craftsman') {
                        window.location.href = 'craftsman-pages/assigned-jobs.html';
                        return;
                    }
                } catch (e) {
                    // Invalid stored data, clear it
                    localStorage.removeItem(STORAGE_KEYS.TOKEN);
                    localStorage.removeItem(STORAGE_KEYS.USER);
                }
            }
        })();

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        document.getElementById('craftsman-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;
            
            try {
                // Use unified login instead of separate craftsman login
                const response = await fetch(`${API_BASE_URL}/Auth/unified-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        emailOrMobile: mobile, 
                        password: password 
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    showError(data.message || 'Invalid mobile number or password');
                    return;
                }
                
                // Verify this is a craftsman account
                if (data.userType !== 'craftsman') {
                    showError('This login is for craftsmen only. Please use the correct login page.');
                    return;
                }
                
                // Store authentication data using unified system
                localStorage.setItem(STORAGE_KEYS.TOKEN, data.token);
                localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(data));
                
                // Redirect to craftsman portal
                window.location.href = data.redirectUrl || 'craftsman-pages/assigned-jobs.html';
                
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed. Please check your credentials and try again.');
            }
        });

        // Auto-format mobile number
        document.getElementById('mobile').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
